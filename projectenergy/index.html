<!DOCTYPE html>
<!--
  Energy Map — full-bleed interactive map with a floating sidebar
  Theme: BlackBerry / BB10 (dark by default, light toggle)
  Features:
    - 100+ Comprehensive Verified Renewable Projects across Viet Nam
    - Live Overpass API Query Engine
    - Transmission Grid (500kV, 220kV) & Substations
    - Data Provenance and Sources Transparency Section
    - Unified Details Modal & Geolocation (My Location)
-->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Energy Map + Renewable Viet Nam</title>
<meta name="description" content="Interactive map of Viet Nam showing potential areas for solar, wind, hydro, LNG, nuclear, 100+ projects database, and the National Power Transmission Grid." />
<link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg" />

<script>
  // Dark is the default theme. A saved choice (the header toggle) still wins.
  (function () {
    var t = null;
    try { t = localStorage.getItem('pemap-theme'); } catch (e) { /* storage may be unavailable */ }
    if (t !== 'dark' && t !== 'light') t = 'dark';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>

<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />

<style>
  /* BlackBerry / BB10 design language — matched to the Hub: sharp rectangles,
     hairline chrome, BlackBerry-blue accent (#0072BC → #0092CC), black surfaces,
     red notifications. Dark is the default; the header toggle switches to the
     light "BB10 Bright" palette. */
  :root {
    --primary: #0092CC;
    --primary-hover: #3FC0F5;
    --primary-subtle: rgba(0,146,204,.16);
    --primary-border: rgba(0,146,204,.60);

    --ink: #FFFFFF;
    --ink-secondary: #C9CBD0;
    --muted: #9DA0A6;
    --line: rgba(255,255,255,.15);
    --line-strong: rgba(255,255,255,.34);
    --line-subtle: rgba(255,255,255,.08);
    --bg-page: #000000;
    --card-bg: #0C0C0E;
    --surface-2: #141416;
    --chip: #1D1D21;
    --white: #0C0C0E;
    --btn-face: linear-gradient(180deg,#1E1E22,#141416);
    --notify: #FF2D3F;
    --overlay: rgba(0,0,0,.62);
    --legend-bg: rgba(12,12,14,.94);

    --gold: #f59e0b;
    --gold-bg: rgba(245,158,11,.14);
    --gold-border: rgba(245,158,11,.45);
    --gold-text: #fbbf24;

    --solar: #f59e0b;
    --wind: #3FC0F5;
    --hydro: #5B8DEF;
    --lng: #A855F7;
    --nuclear: #FF2D3F;

    /* Grid Voltage Colors */
    --grid-500: #FF4D4D;
    --grid-220: #FF9F45;

    --radius: 2px;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.70);
    --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.60);
    --shadow-lg: 0 18px 44px -12px rgba(0, 0, 0, 0.80);
  }
  html[data-theme="light"] {
    --primary: #0072BC;
    --primary-hover: #0092CC;
    --primary-subtle: rgba(0,114,188,.10);
    --primary-border: rgba(0,114,188,.50);

    --ink: #000000;
    --ink-secondary: #2F2F35;
    --muted: #3A3A40;
    --line: rgba(0,0,0,.14);
    --line-strong: rgba(0,0,0,.34);
    --line-subtle: rgba(0,0,0,.07);
    --bg-page: #FFFFFF;
    --card-bg: #FFFFFF;
    --surface-2: #F2F2F4;
    --chip: #E7E7EA;
    --white: #FFFFFF;
    --btn-face: linear-gradient(180deg,#FFFFFF,#ECECEF);
    --notify: #C8102E;
    --overlay: rgba(0,0,0,.45);
    --legend-bg: rgba(255,255,255,.96);

    --gold: #d97706;
    --gold-bg: #fffbeb;
    --gold-border: #fde68a;
    --gold-text: #92400e;

    --solar: #d97706;
    --wind: #0072BC;
    --hydro: #2563eb;
    --lng: #9333ea;
    --nuclear: #c8102e;

    --grid-500: #dc2626;
    --grid-220: #ea580c;

    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.06);
    --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.06);
    --shadow-lg: 0 18px 44px -12px rgba(0, 0, 0, 0.18);
  }
  
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    color: var(--ink); background: var(--bg-page); line-height: 1.5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    height: 100vh; overflow: hidden;
  }
  a { color: var(--primary); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ---------- Sidebar header (brand + tools) ---------- */
  .side-head {
    position: relative; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    padding: 13px 14px 11px;
    border-bottom: 1px solid var(--line);
  }
  .side-head::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg,#0072BC,#00A0E0 55%,#3FC0F5); }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .btn.menu-toggle { display: none; }
  .brand { display: flex; flex-direction: row; align-items: center; gap: 11px; text-decoration: none; color: var(--ink); }
  .brand-logo { display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 10px; flex: 0 0 auto; color: #10B981; background: #ECFDF5; border: 1px solid rgba(16,185,129,.32); }
  .brand-logo svg { width: 22px; height: 22px; }
  .brand-text { display: flex; flex-direction: column; }
  .brand-text span { display: block; font-weight: 700; font-size: 15px; color: var(--ink); letter-spacing: -0.01em; }

  /* ---------- Settings popover (drops from the sidebar header) ---------- */
  .settings-pop {
    position: absolute; top: calc(100% + 6px); left: 10px; right: 10px; z-index: 40;
    max-height: min(68vh, 560px); overflow-y: auto;
    background: var(--card-bg); border: 1px solid var(--line-strong); border-radius: var(--radius);
    box-shadow: var(--shadow-lg); padding: 14px 16px;
  }
  .settings-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .settings-head h3 { margin: 0; font-size: 14px; font-weight: 700; color: var(--ink); }
  .settings-head .modal-close { font-size: 20px; }

  .btn {
    text-decoration: none; font-weight: 600; font-size: 12.5px; padding: 7px 14px; border-radius: 8px;
    border: 1px solid var(--line); color: var(--ink-secondary); background: var(--white); cursor: pointer;
    transition: all .15s ease; display: inline-flex; align-items: center; gap: 5px;
  }
  .btn:hover { background: var(--bg-page); border-color: #cbd5e1; color: var(--ink); }
  .btn.solid { background: var(--primary); color: var(--white); border-color: var(--primary); }
  .btn.solid:hover { background: var(--primary-hover); }
  .btn.live-sync { background: #0284c7; color: #fff; border-color: #0284c7; }
  .btn.live-sync:hover { background: #0369a1; }
  .btn.live-sync.syncing { opacity: 0.7; pointer-events: none; }

  /* ---------- Layout: full-bleed map + docked left sidebar ---------- */
  .map-wrap { position: fixed; inset: 0; z-index: 0; background: #e2e8f0; }
  #map { position: absolute; inset: 0; background: #f1f5f9; }

  .side {
    position: fixed; top: 0; left: 0; bottom: 0; z-index: 500;
    display: flex; flex-direction: column;
    width: 370px; max-width: calc(100vw - 24px);
    background: var(--card-bg);
    background: color-mix(in srgb, var(--card-bg) 92%, transparent);
    -webkit-backdrop-filter: blur(14px) saturate(140%); backdrop-filter: blur(14px) saturate(140%);
    border-right: 1px solid var(--line-strong); box-shadow: var(--shadow-lg);
  }
  .side-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 14px; }

  .resizer {
    position: absolute; top: 0; bottom: 0; right: -4px; width: 9px; z-index: 6;
    cursor: col-resize; touch-action: none;
  }
  .resizer::after {
    content: ""; position: absolute; top: 10px; bottom: 10px; left: 4px; width: 2px;
    background: transparent; border-radius: 2px; transition: background .12s ease;
  }
  .resizer:hover::after, .resizer.active::after { background: var(--primary); }
  .map-fallback {
    position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 30px;
    font-size: 14px; color: var(--muted);
  }

  /* ---------- Sidebar Content ---------- */
  
  .card {
    border: 1px solid var(--line); border-radius: var(--radius); padding: 13px; margin-bottom: 12px;
    background: var(--card-bg); box-shadow: var(--shadow-sm);
  }
  details.card { padding: 0 13px; }
  details.card > summary {
    cursor: pointer; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
    font-weight: 700; list-style: none; display: flex; align-items: center; justify-content: space-between;
    padding: 13px 0; user-select: none;
  }
  details.card > summary::-webkit-details-marker { display: none; }
  details.card > summary::after {
    content: "▾"; font-size: 14px; color: var(--muted); transition: transform 0.15s ease;
  }
  details.card:not([open]) > summary::after { transform: rotate(-90deg); }
  details.card .card-body { padding-bottom: 13px; }
  /* The Energy Zone section is always shown — no collapse affordance. */
  .side-body > details.card.always-open > summary { cursor: default; }
  .side-body > details.card.always-open > summary::after { display: none; }

  .badge-count {
    font-size: 10px; font-weight: 700; background: var(--primary-subtle);
    color: var(--primary); padding: 2px 7px; border-radius: 999px;
  }

  .row { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
  .row label { flex: 1 1 auto; font-size: 12.8px; color: var(--ink-secondary); cursor: pointer; font-weight: 500; }
  .swatch {
    width: 15px; height: 15px; border-radius: 4px; border: 1px solid rgba(0,0,0,.1); flex: 0 0 auto;
  }
  .sw.solar { background: var(--solar); }
  .sw.wind  { background: var(--wind); }
  .sw.hydro { background: var(--hydro); }
  .sw.lng   { background: var(--lng); }
  .sw.nuclear { background: var(--nuclear); }

  /* Grid line swatches */
  .grid-swatch {
    width: 18px; height: 3px; border-radius: 2px; flex: 0 0 auto;
  }
  .grid-swatch.g500 { background: var(--grid-500); height: 4px; }
  .grid-swatch.g220 { background: var(--grid-220); height: 3px; }
  .grid-swatch.subst { width: 14px; height: 14px; border-radius: 3px; background: #334155; border: 2px solid #fff; box-shadow: 0 0 0 1.5px #334155; }

  .count { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }
  
  #base-list .row { padding: 4px 0; }
  #base-list input[type=radio] { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }
  #base-list .bl { font-size: 13px; cursor: pointer; flex: 1 1 auto; color: var(--ink); }
  #base-list .badge {
    font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--primary);
    background: var(--primary-subtle); border: 1px solid var(--primary-border); border-radius: 999px; padding: 2px 7px;
  }
  .base-status { font-size: 11.5px; color: var(--muted); margin: 8px 0 0; }

  /* ---------- Resources & Zones list ---------- */
  .side-clear { display: flex; width: 100%; justify-content: center; margin-bottom: 12px; }
  .ez-list { list-style: none; margin: 0; padding: 0; max-height: 360px; overflow: auto; }
  .ez-item { border-bottom: 1px solid var(--line-subtle); }
  .ez-item:last-child { border-bottom: none; }
  .ez-row {
    display: flex; align-items: center; gap: 9px; padding: 8px 6px; border-radius: 6px;
    cursor: pointer; transition: background .12s ease;
  }
  .ez-row:hover { background: var(--surface-2); }
  .ez-caret { width: 12px; flex: 0 0 auto; color: var(--muted); font-size: 11px; line-height: 1; transition: transform .15s ease; }
  .ez-caret.is-blank { visibility: hidden; }
  .ez-item.open .ez-caret { transform: rotate(90deg); }
  .ez-name { flex: 1 1 auto; font-size: 12.8px; font-weight: 600; color: var(--ink-secondary); }
  .ez-row input[type=checkbox] { flex: 0 0 auto; }
  .ez-zones { display: none; padding: 0 0 8px; }
  .ez-item.open .ez-zones { display: block; }
  .ez-zones ul { list-style: none; margin: 0; padding: 0 0 0 26px; }
  .ez-zones li { margin-bottom: 2px; }
  .ez-subhead { padding: 7px 0 2px 26px; font-size: 9.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .ez-zones button {
    display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left; cursor: pointer;
    border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 6px 8px; font: inherit;
    transition: background .12s ease;
  }
  .ez-zones button:hover { background: var(--surface-2); border-color: var(--line); }
  .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; flex: 0 0 auto; }
  .dot.solar { background: var(--solar); } .dot.wind { background: var(--wind); } .dot.hydro { background: var(--hydro); }
  .dot.lng { background: var(--lng); } .dot.nuclear { background: var(--nuclear); }
  .zt { font-size: 12.3px; font-weight: 600; color: var(--ink); }
  .zm { font-size: 11px; color: var(--muted); }

  /* ---------- Companies & Projects Panel ---------- */
  .co-search {
    width: 100%; padding: 8px 11px; font: inherit; font-size: 12.8px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--bg-page); color: var(--ink); margin-bottom: 8px;
    outline: none; transition: border-color .15s ease;
  }
  .co-search:focus { border-color: var(--primary); background: var(--white); }
  .co-actions { display: flex; gap: 7px; margin-bottom: 9px; flex-wrap: wrap; }
  .btn.mini {
    font-size: 11.8px; padding: 5px 11px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--white); color: var(--ink-secondary); font-weight: 600;
  }
  .btn.mini:hover { background: var(--bg-page); color: var(--ink); }
  .co-list { list-style: none; margin: 0; padding: 0; max-height: 280px; overflow: auto; }
  .co-item { border-bottom: 1px solid var(--line-subtle); }
  .co-item:last-child { border-bottom: none; }
  
  .co-head {
    display: flex; align-items: flex-start; gap: 9px; width: 100%; text-align: left;
    background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 8px; font: inherit;
    transition: background .12s ease; cursor: pointer;
  }
  .co-head:hover { background: var(--bg-page); }
  .co-item.on .co-head { background: var(--primary-subtle); border-color: var(--primary-border); }
  
  .co-check {
    flex: 0 0 auto; width: 16px; height: 16px; margin-top: 3px; border: 1.5px solid #cbd5e1;
    border-radius: 4px; display: grid; place-items: center; font-size: 10px; color: transparent; line-height: 1;
    background: var(--white); cursor: pointer;
  }
  .co-item.on .co-check { background: var(--primary); border-color: var(--primary); color: #fff; }
  
  .co-body { flex: 1 1 auto; min-width: 0; }
  .co-title-row { display: flex; align-items: center; gap: 6px; }
  .co-name { font-size: 12.5px; font-weight: 600; color: var(--ink); flex: 1 1 auto; }
  .co-caret { font-size: 11px; color: var(--muted); transition: transform 0.15s ease; flex: 0 0 auto; }
  .co-item.expanded .co-caret { transform: rotate(180deg); }
  
  .co-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .co-tags { margin-top: 4px; display: flex; gap: 4px; flex-wrap: wrap; }
  .co-tag {
    font-size: 9.5px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
    padding: 1px 6px; border-radius: 4px; color: #fff;
  }
  .co-tag.solar { background: var(--solar); } .co-tag.wind { background: var(--wind); } .co-tag.hydro { background: var(--hydro); }
  .co-tag.lng { background: var(--lng); } .co-tag.nuclear { background: var(--nuclear); }
  
  .btn-details {
    display: none; align-items: center; justify-content: center; gap: 4px; width: 100%;
    margin-top: 7px; padding: 4px 8px; font-size: 11.5px; font-weight: 600;
    color: var(--primary); background: var(--white); border: 1px solid var(--primary-border);
    border-radius: 6px; cursor: pointer; transition: all 0.12s ease;
  }
  .btn-details:hover { background: var(--primary); color: #fff; }
  .co-item.expanded .btn-details { display: flex; }

  .co-proj { display: none; padding: 0 8px 9px 33px; }
  .co-item.expanded .co-proj { display: block; }
  .co-proj ul { list-style: none; margin: 0; padding: 0; }
  .co-proj li { margin: 4px 0; }
  .co-proj-row { display: flex; align-items: center; gap: 6px; }
  .co-proj button.p-target {
    display: flex; align-items: center; gap: 7px; flex: 1 1 auto; text-align: left; cursor: pointer;
    background: transparent; border: none; padding: 3px 0; font: inherit; font-size: 12.2px; color: var(--ink-secondary);
  }
  .co-proj button.p-target:hover { color: var(--primary); text-decoration: underline; }
  .co-proj .pdot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .co-proj .pdot.solar { background: var(--solar); } .co-proj .pdot.wind { background: var(--wind); } .co-proj .pdot.hydro { background: var(--hydro); }
  .co-proj .pdot.lng { background: var(--lng); } .co-proj .pdot.nuclear { background: var(--nuclear); }
  .co-proj .pcap { margin-left: auto; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  
  .btn-p-info {
    border: 1px solid var(--line); background: var(--white); color: var(--muted);
    font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; cursor: pointer;
    line-height: 1.2; flex: 0 0 auto; transition: all 0.12s ease;
  }
  .btn-p-info:hover { color: var(--primary); border-color: var(--primary-border); background: var(--primary-subtle); }

  .co-hint { font-size: 11.5px; color: var(--muted); margin: 9px 0 0; }
  .btn.mini.accent { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn.mini.accent:hover { background: var(--primary-hover); }
  .btn.mini.primary { background: var(--primary); color: #fff; border-color: var(--primary); flex: 1 1 auto; }
  .btn.mini.primary:hover { background: var(--primary-hover); }

  .add-form {
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg-page);
    padding: 12px; margin-bottom: 10px;
  }
  .add-form label { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; color: var(--muted); margin: 8px 0 3px; text-transform: uppercase; }
  .add-form input, .add-form select {
    width: 100%; padding: 7px 9px; font: inherit; font-size: 12.8px; border: 1px solid var(--line);
    border-radius: 6px; background: #fff; color: var(--ink); outline: none;
  }
  .add-form input:focus, .add-form select:focus { border-color: var(--primary); }
  .add-form .add-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .add-form .add-actions { display: flex; gap: 8px; margin-top: 12px; }
  #np-pick { margin-top: 8px; }
  #np-pick.armed { background: var(--gold); border-color: transparent; color: #fff; }

  .co-item.custom .co-name::after {
    content: "CUSTOM"; font-size: 9px; font-weight: 700; letter-spacing: .05em; color: var(--primary);
    background: var(--primary-subtle); border: 1px solid var(--primary-border); border-radius: 999px; padding: 1px 6px; margin-left: 6px; vertical-align: 1px;
  }
  .co-del {
    border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 14px;
    line-height: 1; padding: 2px 4px; border-radius: 4px; flex: 0 0 auto;
  }
  .co-del:hover { background: #fee2e2; color: #dc2626; }

  /* Map pins & Substations */
  .company-pin { background: none; border: none; }
  .company-pin svg { display: block; filter: drop-shadow(0 2px 4px rgba(0,0,0,.25)); }
  .company-pin.hi svg { transform: scale(1.25); transform-origin: 50% 100%; }

  /* Viet Nam archipelago labels (Hoang Sa / Truong Sa) */
  .island-tag { background: transparent; border: none; pointer-events: none; }
  .island-tag span {
    display: inline-block; transform: translate(-50%, -50%);
    padding: 1px 7px; border-radius: 5px; white-space: nowrap;
    font-size: 11px; font-weight: 700; letter-spacing: .02em;
    color: #b91c1c; background: rgba(255, 255, 255, 0.92);
    border: 1px solid rgba(218, 37, 29, 0.55);
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
  }

  .substation-icon {
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); border: 2px solid #ffffff;
    font-size: 10px; font-weight: 800; color: #ffffff; cursor: pointer;
  }
  .substation-icon.s500 { background: var(--grid-500); width: 22px; height: 22px; }
  .substation-icon.s220 { background: var(--grid-220); width: 18px; height: 18px; font-size: 8.5px; }

  @keyframes pulse {
    0% { transform: scale(0.6); opacity: 1; }
    100% { transform: scale(2.2); opacity: 0; }
  }

  /* Settings popover section heading */
  .sec-head { margin: 14px 0 6px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .sec-head:first-child { margin-top: 0; }

  .scale-note {
    background: rgba(255, 255, 255, 0.95); color: var(--ink-secondary); font-size: 10.5px; padding: 6px 10px;
    border-radius: 8px; border: 1px solid var(--line); box-shadow: var(--shadow-sm); font-weight: 500;
  }

  /* ---------- Modal / Info Drawer ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45); backdrop-filter: blur(2px);
    z-index: 1300; display: none; align-items: center; justify-content: center; padding: 20px;
  }

    function setBaseStatus(msg) {
      if (!baseStatusEl) return;
      baseStatusEl.textContent = msg || "";
    }

    function setBase(name) {
      if (currentBase) { map.removeLayer(currentBase); currentBase = null; }

      var cfg = (name in BASE) ? BASE[name] : null;
      if (!cfg) return;

      var opts = { maxZoom:cfg.maxZoom || 19, attribution:cfg.attribution };
      if (cfg.subdomains) opts.subdomains = cfg.subdomains;
      var url = cfg.url;

      var oks = 0, errs = 0, advancing = false;
      var layer = L.tileLayer(url, opts);

      layer.on("tileload", function () {
        oks++;
        if (oks === 1) setBaseStatus("");
      });
      layer.on("tileerror", function () {
        errs++;
        if (!cfg || advancing || oks > 0 || errs < 5) return;
        var idx = BASE_ORDER.indexOf(name);
        var next = BASE_ORDER[idx + 1];
        if (!next) {
          setBaseStatus("All basemaps are unreachable — check your connection.");
          return;
        }
        advancing = true;
        setBaseStatus("“" + cfg.label + "” unavailable — switched to “" + BASE[next].label + "”.");
        var radio = document.querySelector('input[name="base"][value="' + next + '"]');
        if (radio) radio.checked = true;
        setBase(next);
      });

      layer.addTo(map);
      layer.bringToBack();
      currentBase = layer;
      currentBaseName = name;

      var radio = document.querySelector('input[name="base"][value="' + name + '"]');
      if (radio) radio.checked = true;
    }

        (cfg.badge ? '<span class="badge">' + cfg.badge + '</span>' : "");

    function isletRing(lat, lng) {
      var r = 0.18, pts = [];
      for (var i = 0; i < 6; i++) {
        var a = Math.PI / 3 * i;
        pts.push([lat + r * Math.sin(a), lng + r * Math.cos(a)]);
      }
      return pts;
    }

    var islandsLayer = L.layerGroup().addTo(map);

    ARCHIPELAGOS.forEach(function (arch) {
      arch.islets.forEach(function (p) {
        L.polygon(isletRing(p[0], p[1]), {
          color:"#f59e0b", weight:1.2, opacity:1,
          fillColor:"#da251d", fillOpacity:1, interactive:false
        }).addTo(islandsLayer);
      });
      L.marker(arch.label, {

        icon:L.divIcon({ className:"island-tag", html:"<span>" + arch.name + "</span>", iconSize:null })
      }).addTo(islandsLayer);

    function activeEnergyTypes() {
      var s = new Set();
      EZ_TYPES.forEach(function (t) {
        var box = document.getElementById("t-" + t.key);
        if (box && box.checked) s.add(t.key);
      });
      return s;
    }

    function renderCompanyMarkers(fit) {
      /* Pins follow the ticked energy types and/or the ticked companies.
         Every type ticked (the default) means no type filter. */
      var types = activeEnergyTypes();
      var typeFilter = types.size < EZ_TYPES.length;
      var filtering = selectedCompanies.size > 0 || typeFilter;
      if (filtering && !map.hasLayer(layers.projects)) {
        var box = document.getElementById("t-projects");
        if (box) box.checked = true;
        map.addLayer(layers.projects);
      }

      layers.projects.clearLayers();
      var shown = projectMarkers.filter(function (pm) {
        if (!filtering) return true;
        return selectedCompanies.has(pm.project.company) || (typeFilter && types.has(pm.project.type));
      });
      shown.forEach(function (pm) { pm.layer.addTo(layers.projects); });

      document.getElementById("c-projects").textContent =
        shown.length + " / " + projectMarkers.length + " pinned";

      /* The Projects badge follows the current filter (and shows the full registry when none). */
      var filtered = selectedCompanies.size > 0 || (types.size > 0 && types.size < EZ_TYPES.length);
      document.getElementById("reg-count").textContent =
        (filtered ? shown.length : projectMarkers.length) + " loaded";

      if (fit && shown.length) {
        var bounds = L.latLngBounds(shown.map(function (pm) { return [pm.project.lat, pm.project.lon]; }));
        map.fitBounds(bounds.pad(0.25));
      }
    }

    function findMarker(p) {
      return projectMarkers.filter(function (pm) {
        return pm.project.name === p.name && pm.project.company === p.company &&
               pm.project.lat === p.lat && pm.project.lon === p.lon;
      })[0];
    }

    function zoomToProject(p) {
      var hit = findMarker(p);
      if (!hit) return;
      if (!map.hasLayer(layers.projects)) {
        document.getElementById("t-projects").checked = true;
        map.addLayer(layers.projects);
      }
      hit.layer.addTo(layers.projects);
      map.setView([p.lat, p.lon], Math.max(map.getZoom(), 11));
      hit.layer.openPopup();
    }

    /* ---------------- Unified Details Modal ---------------- */
    var modalEl = document.getElementById("details-modal");
    var modalTitleEl = document.getElementById("modal-details-title");
    var modalContentEl = document.getElementById("modal-details-content");
    var modalCloseEl = document.getElementById("modal-details-close");

    function closeModal() { modalEl.classList.remove("active"); }
    modalCloseEl.addEventListener("click", closeModal);
    modalEl.addEventListener("click", function (e) { if (e.target === modalEl) closeModal(); });

    function renderFallbackCompanyProfile(co, companyName) {
      var known = KNOWN_COMPANIES[companyName] || {};
      var siteUrl = known.url || ("https://www.google.com/search?q=" + encodeURIComponent(companyName + " Vietnam renewable energy official website"));
      var searchUrl = "https://www.google.com/search?q=" + encodeURIComponent(companyName + " năng lượng tái tạo");
      var mstUrl = "https://masothue.com/Search/?q=" + encodeURIComponent(known.vnName || companyName);
      var vietstockUrl = "https://finance.vietstock.vn/search?q=" + encodeURIComponent(companyName);

      return '' +
        '<span class="meta-tag-badge">' + (co.country || "General Profile") + '</span>' +
        '<p style="margin:0 0 12px;font-size:13px;line-height:1.5;color:#334155;">' +
          (known.desc || "Enterprise operating in Vietnam's energy infrastructure and clean power sector.") +
        '</p>' +
        '<table class="co-table">' +
          (known.vnName ? '<tr><th>Registered Name</th><td>' + known.vnName + '</td></tr>' : '') +
          (known.taxCode ? '<tr><th>Tax Code (MST)</th><td><code>' + known.taxCode + '</code></td></tr>' : '') +
          (known.headquarters ? '<tr><th>Headquarters</th><td>' + known.headquarters + '</td></tr>' : '') +
          '<tr><th>Projects on Map</th><td>' + (co.projects ? co.projects.length : 0) + ' project site(s)</td></tr>' +
          '<tr><th>Official Website</th><td><a href="' + siteUrl + '" target="_blank" rel="noopener">' + (known.url || "Search official website ↗") + '</a></td></tr>' +
        '</table>' +
        '<div class="co-external-links">' +
          '<a class="btn mini" href="' + siteUrl + '" target="_blank" rel="noopener">🌐 Visit Website</a>' +
          '<a class="btn mini" href="' + searchUrl + '" target="_blank" rel="noopener">🔍 Google Search</a>' +
          '<a class="btn mini" href="' + mstUrl + '" target="_blank" rel="noopener">📋 Masothue Lookup</a>' +
          '<a class="btn mini" href="' + vietstockUrl + '" target="_blank" rel="noopener">📈 Finance Data</a>' +
        '</div>';
    }

    function showCompanyProfile(companyName) {
      var co = companyModel.find(function(c){ return c.name.toLowerCase() === companyName.toLowerCase(); }) || { name: companyName };
      modalTitleEl.textContent = companyName + " — Company Profile";
      modalEl.classList.add("active");
      modalContentEl.innerHTML = renderFallbackCompanyProfile(co, companyName);
    }

    function showProjectDetails(p) {
      modalTitleEl.textContent = p.name;
      modalEl.classList.add("active");

      var searchUrl = "https://www.google.com/search?q=" + encodeURIComponent(p.name + " " + p.company + " " + p.loc + " năng lượng");
      var mapsUrl = "https://www.google.com/maps/search/?api=1&query=" + p.lat + "," + p.lon;

      modalContentEl.innerHTML = '' +
        '<span class="meta-tag-badge" style="background:' + COLORS[p.type] + '18; color:' + COLORS[p.type] + '; border-color:' + COLORS[p.type] + '55;">' +
          LABELS[p.type] + ' Project' +
        '</span>' +
        (p.note ? '<p style="margin:0 0 12px;font-size:13px;line-height:1.5;color:#334155;">' + p.note + '</p>' : '') +
        '<table class="co-table">' +
          '<tr><th>Developer / Owner</th><td><strong>' + p.company + '</strong> (' + (p.country || "Viet Nam") + ')</td></tr>' +
          '<tr><th>Capacity</th><td>' + p.cap + '</td></tr>' +
          '<tr><th>Location</th><td>' + p.loc + '</td></tr>' +
          '<tr><th>Coordinates</th><td><code>' + p.lat.toFixed(4) + ', ' + p.lon.toFixed(4) + '</code></td></tr>' +
          '<tr><th>Source Record</th><td>' + (p.source === 'user' ? 'User Custom Entry' : 'Reference Compilation') + '</td></tr>' +
        '</table>' +
        '<div class="co-external-links">' +
          '<button class="btn mini primary" id="modal-zoom-btn" type="button">📍 Zoom to Project</button>' +
          '<a class="btn mini" href="' + searchUrl + '" target="_blank" rel="noopener">🔍 Search News & Data</a>' +
          '<a class="btn mini" href="' + mapsUrl + '" target="_blank" rel="noopener">🗺️ Open in Google Maps</a>' +
        '</div>';

      document.getElementById("modal-zoom-btn").addEventListener("click", function() {

    /* ---------------- Companies List UI ---------------- */
    var companyListEl = document.getElementById("company-list");
    var companyRows = [];

    function buildCompanyList() {
      companyListEl.innerHTML = "";
      companyRows = [];

      companyModel.forEach(function (c) {
        var li = document.createElement("li");
        li.className = "co-item" + (c.custom ? " custom" : "");

        var types = [];
        c.projects.forEach(function (p) { if (types.indexOf(p.type) === -1) types.push(p.type); });
        var tags = types.map(function (t) {
          return '<span class="co-tag ' + t + '">' + LABELS[t] + '</span>';
        }).join("");

        var head = document.createElement("div");
        head.className = "co-head";
        head.innerHTML =
          '<span class="co-check" title="Toggle project markers on map">✓</span>' +
          '<div class="co-body">' +
            '<div class="co-title-row">' +
              '<span class="co-name">' + c.name + '</span>' +
              '<span class="co-caret">▼</span>' +
            '</div>' +
            '<div class="co-meta">' + c.country + ' · ' + c.projects.length +
              ' project' + (c.projects.length > 1 ? 's' : '') + '</div>' +
            '<div class="co-tags">' + tags + '</div>' +
            '<button type="button" class="btn-details">ℹ View Company Details</button>' +
          '</div>';

        head.querySelector(".co-check").addEventListener("click", function (e) {
          e.stopPropagation();
          if (selectedCompanies.has(c.name)) { selectedCompanies.delete(c.name); }
          else { selectedCompanies.add(c.name); }
          syncCompanyUI(true);
        });

        head.querySelector(".btn-details").addEventListener("click", function (e) {
          e.stopPropagation();
          showCompanyProfile(c.name);
        });

        head.addEventListener("click", function (e) {
          if (e.target.closest(".co-check") || e.target.closest(".btn-details")) return;
          if (expandedCompanies.has(c.name)) {
            expandedCompanies.delete(c.name);
          } else {
            expandedCompanies.add(c.name);
          }
          syncAccordionUI();
        });

        var proj = document.createElement("div");
        proj.className = "co-proj";
        var ul = document.createElement("ul");
        c.projects.forEach(function (p) {
          var pli = document.createElement("li");
          var row = document.createElement("div");
          row.className = "co-proj-row";

          var pb = document.createElement("button");
          pb.type = "button";
          pb.className = "p-target";
          pb.innerHTML =
            '<span class="pdot ' + p.type + '"></span>' +
            '<span>' + p.name + '</span>' +
            '<span class="pcap">' + p.cap + '</span>';
          pb.addEventListener("click", function (e) {
            e.stopPropagation();
            zoomToProject(p);
          });
          row.appendChild(pb);

          var pInfoBtn = document.createElement("button");
          pInfoBtn.type = "button";
          pInfoBtn.className = "btn-p-info";
          pInfoBtn.textContent = "Details";
          pInfoBtn.title = "View project specifications and details";
          pInfoBtn.addEventListener("click", function (e) {
            e.stopPropagation();
            showProjectDetails(p);
          });
          row.appendChild(pInfoBtn);

          if (p.source === "user") {
            var del = document.createElement("button");
            del.type = "button";
            del.className = "co-del";
            del.title = "Delete this project";
            del.innerHTML = "×";
            del.addEventListener("click", function (e) {
              e.stopPropagation();
              if (!confirm('Delete "' + p.name + '"?')) return;
              userProjects = userProjects.filter(function (u) { return u.id !== p.id; });
              saveUserProjects();
              rebuildAll(false);
            });
            row.appendChild(del);
          }

          pli.appendChild(row);
          ul.appendChild(pli);
        });
        proj.appendChild(ul);

        li.appendChild(head);
        li.appendChild(proj);
        companyListEl.appendChild(li);
        companyRows.push({ name:c.name, li:li, company:c });
      });

      var names = companyModel.map(function (c) { return c.name; });
      selectedCompanies.forEach(function (n) { if (names.indexOf(n) === -1) selectedCompanies.delete(n); });
      expandedCompanies.forEach(function (n) { if (names.indexOf(n) === -1) expandedCompanies.delete(n); });

      syncAccordionUI();
      applySearch();
    }

    function syncAccordionUI() {
      companyRows.forEach(function (row) {
        row.li.classList.toggle("expanded", expandedCompanies.has(row.name));
      });
    }

    function syncCompanyUI(fit) {
      companyRows.forEach(function (row) {
        row.li.classList.toggle("on", selectedCompanies.has(row.name));
      });
      renderCompanyMarkers(fit);
    }

    var searchEl = document.getElementById("company-search");
    function applySearch() {
      var q = searchEl.value.trim().toLowerCase();
      /* When only some energy types are ticked, list just the companies that hold one of them. */
      var types = activeEnergyTypes();
      var typeFilter = types.size > 0 && types.size < EZ_TYPES.length;
      companyRows.forEach(function (row) {
        var hay = (row.name + " " + row.company.country + " " +
          row.company.projects.map(function (p) { return p.name + " " + p.loc; }).join(" ")).toLowerCase();
        var match = q === "" || hay.indexOf(q) > -1;
        if (match && typeFilter) {
          match = row.company.projects.some(function (p) { return types.has(p.type); });
        }
        row.li.style.display = match ? "" : "none";
        if (q !== "" && match) {
          expandedCompanies.add(row.name);
        }
      });
      syncAccordionUI();
    }

    /* The Projects box opens while an energy-zone selection is active, closes when there is none. */
    function syncProjectsBox() {
      var types = activeEnergyTypes();
      var box = document.getElementById("projects-box");
      if (box) box.open = types.size > 0 && types.size < EZ_TYPES.length;
    }
    searchEl.addEventListener("input", applySearch);

    function rebuildAll(fit) {
      companyModel = buildModel();
      rebuildProjectMarkers();
      buildCompanyList();
      fillCompanyNames();
      updateResourceCounts();
      fillEzProjects();
      syncCompanyUI(fit);
      syncProjectsBox();
    }

    function updateResourceCounts() {
      var counts = { solar: 0, wind: 0, hydro: 0, lng: 0, nuclear: 0 };
      companyModel.forEach(function (c) {
        c.projects.forEach(function (p) {
          if (counts[p.type] !== undefined) counts[p.type]++;
        });
      });
      document.getElementById("c-solar").textContent = counts.solar + " projects";
      document.getElementById("c-wind").textContent = counts.wind + " projects";
      document.getElementById("c-hydro").textContent = counts.hydro + " projects";
      document.getElementById("c-lng").textContent = counts.lng + " projects";
      document.getElementById("c-nuclear").textContent = counts.nuclear + " sites";
    }

    function fillCompanyNames() {
      var dl = document.getElementById("company-names");
      dl.innerHTML = companyModel.map(function (c) {
        return '<option value="' + c.name.replace(/"/g, "&quot;") + '"></option>';
      }).join("");
    }

    /* Select all — ticks every company currently listed (respects the search & type filter). */
    document.getElementById("co-all").addEventListener("click", function () {
      companyRows.forEach(function (row) {
        if (row.li.style.display !== "none") selectedCompanies.add(row.name);
      });
      syncCompanyUI(true);
    });
    /* ---------------- Live Overpass API Query ---------------- */
    var liveBtn = document.getElementById("btn-live-osm");

    liveBtn.onclick = function () {
      liveBtn.classList.add("syncing");

      var query = '[out:json][timeout:25];area["ISO3166-1"="VN"][admin_level=2]->.a;(node["power"="plant"]["plant:source"~"solar|wind"](area.a);way["power"="plant"]["plant:source"~"solar|wind"](area.a););out center 40;';
      var url = 'https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(query);

      fetch(url)
        .then(function (res) { return res.json(); })
        .then(function (data) {
          var count = 0;
          if (data && data.elements) {
            data.elements.forEach(function (el) {
              var lat = el.lat || (el.center && el.center.lat);
              var lon = el.lon || (el.center && el.center.lon);
              if (!lat || !lon) return;

              var name = (el.tags && el.tags.name) || "Live Power Facility";
              var source = (el.tags && el.tags["plant:source"]) || "solar";
              var output = (el.tags && el.tags["plant:output:electricity"]) || "Grid Active";
              var operator = (el.tags && el.tags.operator) || "Community";

              PROJECTS_DB.push({
                name: name,
                company: operator + " [Live]",
                country: "Viet Nam",
                type: source === "wind" ? "wind" : "solar",
                cap: output,
                loc: "Vietnam",
                lat: lat,
                lon: lon,
                note: "Live data point received from the Overpass API."
              });
              count++;
            });
          }
          rebuildAll(false);
          liveBtn.classList.remove("syncing");
          liveBtn.classList.add("done");
          setTimeout(function () { liveBtn.classList.remove("done"); }, 1600);
        })
        .catch(function (err) {
          liveBtn.classList.remove("syncing");
        });
    };

    /* ---------------- Add a project ---------------- */
    var addForm = document.getElementById("add-form");
    var pickBtn = document.getElementById("np-pick");
    var pickMarker = null;
    var picking = false;

    document.getElementById("co-add").addEventListener("click", function () {
      addForm.hidden = !addForm.hidden;
      if (!addForm.hidden) document.getElementById("np-company").focus();
    });

    document.getElementById("np-cancel").addEventListener("click", function () {
      stopPicking();
      addForm.reset();
      addForm.hidden = true;
    });

    function stopPicking() {
      picking = false;
      pickBtn.classList.remove("armed");
      pickBtn.textContent = "Pick point on map";
      map.getContainer().style.cursor = "";
      if (pickMarker) { map.removeLayer(pickMarker); pickMarker = null; }
    }

    pickBtn.addEventListener("click", function () {
      picking = !picking;
      if (picking) {
        pickBtn.classList.add("armed");
        pickBtn.textContent = "Click the map…";
        map.getContainer().style.cursor = "crosshair";
      } else {
        stopPicking();
      }
    });

    map.on("click", function (e) {
      if (!picking) return;
      document.getElementById("np-lat").value = e.latlng.lat.toFixed(4);
      document.getElementById("np-lon").value = e.latlng.lng.toFixed(4);
      if (pickMarker) map.removeLayer(pickMarker);
      pickMarker = L.marker(e.latlng, { icon: pinIcon(document.getElementById("np-type").value) })
        .addTo(map).bindPopup("New project point").openPopup();
      stopPicking();
    });

    addForm.addEventListener("submit", function (e) {
      e.preventDefault();
      var company = document.getElementById("np-company").value.trim();
      var name = document.getElementById("np-name").value.trim();
      var type = document.getElementById("np-type").value;
      var size = document.getElementById("np-size").value.trim();
      var loc = document.getElementById("np-loc").value.trim() || "—";
      var lat = parseFloat(document.getElementById("np-lat").value);
      var lon = parseFloat(document.getElementById("np-lon").value);

      if (!company || !name) { alert("Please enter a company and project name."); return; }
      if (!isFinite(lat) || !isFinite(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) {
        alert("Please enter valid coordinates (or use “Pick point on map”)."); return;
      }

      var id = "u" + Date.now() + "_" + (++pickSeq);
      userProjects.push({
        id:id, company:company, name:name, type:type,
        cap:size ? (size + " MW") : "—", loc:loc, lat:lat, lon:lon,
        note:"Custom project registered locally in browser."
      });
      saveUserProjects();

      stopPicking();
      addForm.reset();
      addForm.hidden = true;

      selectedCompanies.add(company);
      expandedCompanies.add(company);
      rebuildAll(true);

      var p = { name:name, type:type, cap:size ? (size + " MW") : "—",
                loc:loc, lat:lat, lon:lon, company:company, note:"Custom project registered locally in browser." };
      zoomToProject(p);
    });

    /* ---------------- Export selected projects (CSV) ---------------- */
    document.getElementById("co-export").addEventListener("click", function () {
      var types = activeEnergyTypes();
      var typeFilter = types.size > 0 && types.size < EZ_TYPES.length;
      var rows = projectMarkers.filter(function (pm) {
        return selectedCompanies.has(pm.project.company) || (typeFilter && types.has(pm.project.type));
      }).map(function (pm) { return pm.project; });

      if (!rows.length) { alert("Select a company or an energy type first."); return; }

      var cell = function (v) { return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; };
      var csv = ["Name,Company,Type,Capacity,Location,Latitude,Longitude"];
      rows.forEach(function (p) {
        csv.push([cell(p.name), cell(p.company), cell(LABELS[p.type] || p.type), cell(p.cap),
          cell(p.loc), p.lat, p.lon].join(","));
      });

      var blob = new Blob([csv.join("\n")], { type:"text/csv;charset=utf-8" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "renewable-vietnam-selected-projects.csv";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    });

    var fileInput = document.getElementById("co-file");
    document.getElementById("co-import").addEventListener("click", function () { fileInput.click(); });
    fileInput.addEventListener("change", function () {
      var file = fileInput.files && fileInput.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var data = JSON.parse(reader.result);
          if (!Array.isArray(data)) throw new Error("not an array");
          var added = 0;
          data.forEach(function (u) {
            if (!u || !u.company || !u.name || !isFinite(u.lat) || !isFinite(u.lon)) return;
            userProjects.push({
              id:"u" + Date.now() + "_" + (++pickSeq),
              company:String(u.company), name:String(u.name),
              type:["solar","wind","hydro","lng","nuclear"].indexOf(u.type) > -1 ? u.type : "solar",
              cap:u.cap ? String(u.cap) : "—", loc:u.loc ? String(u.loc) : "—",
              lat:parseFloat(u.lat), lon:parseFloat(u.lon),
              note:u.note || "Imported project data."
            });
            added++;
          });
          saveUserProjects();
          rebuildAll(false);
          alert("Imported " + added + " project(s).");
        } catch (err) {
          alert("Could not read that file — expected a JSON list exported from this page.");
        }
        fileInput.value = "";
      };
      reader.readAsText(file);
    });

    /* ---------------- Energy Zone list ---------------- */
    /* Energy type first; clicking a type reveals its zones and its projects. */
    var EZ_TYPES = [
      { key:"solar",   label:"Solar potential" },
      { key:"wind",    label:"Wind potential" },
      { key:"hydro",   label:"Hydropower potential" },
      { key:"lng",     label:"LNG terminals & gas-to-power" },
      { key:"nuclear", label:"Nuclear plant area" }
    ];
    var ezListEl = document.getElementById("ez-list");

    function ezZoneItem(z) {
      var li = document.createElement("li");
      var b = document.createElement("button");
      b.type = "button";
      b.innerHTML = '<span class="dot ' + z.type + '"></span>' +
        '<span><span class="zt">' + z.name + '</span><br>' +
        '<span class="zm">' + z.rating + ' potential</span></span>';
      b.addEventListener("click", function () {
        map.fitBounds(zoneLayers[z.name].getBounds(), { padding:[40,40] });
        zoneLayers[z.name].openPopup();
      });
      li.appendChild(b);
      return li;
    }

    function ezProjectItem(p) {
      var li = document.createElement("li");
      var b = document.createElement("button");
      b.type = "button";
      b.innerHTML = '<span class="dot ' + p.type + '"></span>' +
        '<span><span class="zt">' + p.name + '</span><br>' +
        '<span class="zm">' + p.company + ' · ' + p.cap + '</span></span>';
      b.addEventListener("click", function () { zoomToProject(p); });
      li.appendChild(b);
      return li;
    }

    /* Selecting a type switches every other type off (and selecting it again restores all). */
    function applyTypeSelection(keys) {
      var want = {};
      keys.forEach(function (k) { want[k] = true; });
      EZ_TYPES.forEach(function (t) {
        var b = document.getElementById("t-" + t.key);
        if (!b || b.checked === !!want[t.key]) return;
        b.checked = !!want[t.key];
        if (b.checked) { if (!map.hasLayer(layers[t.key])) map.addLayer(layers[t.key]); }
        else { map.removeLayer(layers[t.key]); }
      });
      applySearch();
      syncCompanyUI(false);
      syncProjectsBox();
    }
    function selectOnlyType(key) { applyTypeSelection([key]); }
    function selectAllTypes() { applyTypeSelection(EZ_TYPES.map(function (t) { return t.key; })); }
    document.getElementById("ez-all").addEventListener("click", function () {
      selectAllTypes();
      var projectsBox = document.getElementById("projects-box");
      if (projectsBox) projectsBox.open = true;
    });

    EZ_TYPES.forEach(function (t) {
      var li = document.createElement("li");
      li.className = "ez-item";
      var row = document.createElement("div");
      row.className = "ez-row";
      row.innerHTML =
        '<span class="ez-caret">▸</span>' +
        '<span class="swatch sw ' + t.key + '"></span>' +
        '<span class="ez-name">' + t.label + '</span>' +
        '<span class="count" id="c-' + t.key + '"></span>' +
        '<input type="checkbox" id="t-' + t.key + '" checked aria-label="Show ' + t.label + '" />';
      row.addEventListener("click", function (e) {
        if (e.target.closest("input")) return;
        /* Click a type to select it alone; click it again to show all types. */
        var box = document.getElementById("t-" + t.key);
        if (box.checked && activeEnergyTypes().size === 1) {
          selectAllTypes();
          var allBox = document.getElementById("projects-box");
          if (allBox) allBox.open = true;
          Array.prototype.forEach.call(document.querySelectorAll("#ez-list .ez-item.open"), function (r) {
            r.classList.remove("open");
          });
        } else {
          selectOnlyType(t.key);
          Array.prototype.forEach.call(document.querySelectorAll("#ez-list .ez-item.open"), function (r) {
            r.classList.remove("open");
          });
          li.classList.add("open");
        }
      });
      li.appendChild(row);

      var sub = document.createElement("div");
      sub.className = "ez-zones";

      var zHead = document.createElement("div");
      zHead.className = "ez-subhead";
      zHead.textContent = "Zones";
      sub.appendChild(zHead);

      var zUl = document.createElement("ul");
      ZONES.filter(function (z) { return z.type === t.key; }).forEach(function (z) {
        zUl.appendChild(ezZoneItem(z));
      });
      sub.appendChild(zUl);

      var pHead = document.createElement("div");
      pHead.className = "ez-subhead";
      pHead.textContent = "Projects";
      sub.appendChild(pHead);

      var pUl = document.createElement("ul");
      pUl.className = "ez-projs";
      pUl.setAttribute("data-type", t.key);
      sub.appendChild(pUl);

      li.appendChild(sub);
      ezListEl.appendChild(li);
    });

    /* Projects are known only after the model is built, so fill them on every rebuild. */
    function fillEzProjects() {
      var seen = {};
      companyModel.forEach(function (c) {
        c.projects.forEach(function (p) {
          if (!seen[p.type]) seen[p.type] = [];
          seen[p.type].push(p);
        });
      });
      Array.prototype.forEach.call(document.querySelectorAll(".ez-projs"), function (ul) {
        var list = seen[ul.getAttribute("data-type")] || [];
        ul.innerHTML = "";
        list.forEach(function (p) { ul.appendChild(ezProjectItem(p)); });
      });
    }

    /* Clear all — resets energy types, the company selection and the projects layer. */
    document.getElementById("ez-clear").addEventListener("click", function () {
      EZ_TYPES.forEach(function (t) {
        var box = document.getElementById("t-" + t.key);
        if (box && box.checked) { box.checked = false; map.removeLayer(layers[t.key]); }
      });
      Array.prototype.forEach.call(document.querySelectorAll("#ez-list .ez-item.open"), function (li) {
        li.classList.remove("open");
      });

      selectedCompanies.clear();
      expandedCompanies.clear();
      syncAccordionUI();
      applySearch();
      syncCompanyUI(false);
      syncProjectsBox();

      var pbox = document.getElementById("t-projects");
      if (pbox && pbox.checked) { pbox.checked = false; map.removeLayer(layers.projects); }

      map.fitBounds(VN_BOUNDS);
    });

    var scaleNote = L.control({ position:"bottomleft" });
    scaleNote.onAdd = function () {
      var div = L.DomUtil.create("div", "scale-note");
      div.innerHTML = "Study &amp; research only · indicative grid circuits";
      L.DomEvent.disableClickPropagation(div);
      return div;
    };
    scaleNote.addTo(map);

    /* ---------------- Power Grid & Substations panel (bottom-right, above the legend) ---------------- */
    var gridPanel = L.control({ position:"bottomright" });
    gridPanel.onAdd = function () {
      var div = L.DomUtil.create("div", "leaflet-control grid-panel");
      div.innerHTML =
        '<h4 class="gp-toggle">Layers</h4>' +
        '<div class="gp-body">' +
          '<div class="row"><span class="grid-swatch g500"></span>' +
            '<label for="t-grid-500">500 kV Transmission Lines</label>' +
            '<span class="count" id="c-grid-500"></span>' +
            '<input type="checkbox" id="t-grid-500" checked /></div>' +
          '<div class="row"><span class="grid-swatch g220"></span>' +
            '<label for="t-grid-220">220 kV Regional Lines</label>' +
            '<span class="count" id="c-grid-220"></span>' +
            '<input type="checkbox" id="t-grid-220" checked /></div>' +
          '<div class="row">' +
            '<span class="grid-swatch subst"></span>' +
            '<label for="t-substations">Substations (500kV / 220kV)</label>' +
            '<span class="count" id="c-substations"></span>' +
            '<input type="checkbox" id="t-substations" checked /></div>' +
          '<div class="row" style="border-top:1px solid var(--line); margin-top:6px; padding-top:8px;">' +
            '<span class="swatch sw" style="background:var(--primary); border-radius:50%;"></span>' +
            '<label for="t-projects">Company projects</label>' +
            '<span class="count" id="c-projects"></span>' +
            '<input type="checkbox" id="t-projects" checked /></div>' +
        '</div>';
      /* On phones the panel collapses to its heading; tapping it toggles the layer rows. */
      div.querySelector(".gp-toggle").addEventListener("click", function () {
        div.classList.toggle("gp-open");
      });
      L.DomEvent.disableClickPropagation(div);
      L.DomEvent.disableScrollPropagation(div);
      return div;
    };
    gridPanel.addTo(map);

    /* ---------------- Grid layer counts ---------------- */
    document.getElementById("c-grid-500").textContent = gridCounts["500"] + " lines";
    document.getElementById("c-grid-220").textContent = gridCounts["220"] + " lines";
    document.getElementById("c-substations").textContent = gridCounts.substations + " nodes";

    /* ---------------- Layer toggles ---------------- */
    var toggles = {
      "t-solar":        "solar",
      "t-wind":         "wind",
      "t-hydro":        "hydro",
      "t-lng":          "lng",
      "t-nuclear":      "nuclear",
      "t-projects":     "projects",
      "t-grid-500":     "grid500",
      "t-grid-220":     "grid220",
      "t-substations":  "substations"
    };

    function isEnergyType(key) {
      return EZ_TYPES.some(function (t) { return t.key === key; });
    }

    Object.keys(toggles).forEach(function (id) {
      var input = document.getElementById(id);
      input.addEventListener("change", function () {
        var key = toggles[id];
        if (input.checked) { map.addLayer(layers[key]); }
        else { map.removeLayer(layers[key]); }
        /* Ticking an energy type also pins that type's projects and narrows the company list. */
        if (isEnergyType(key)) { applySearch(); syncCompanyUI(false); syncProjectsBox(); }
      });
    });

    document.getElementById("btn-all").addEventListener("click", function () {
      Object.keys(toggles).forEach(function (id) {
        var input = document.getElementById(id);
        input.checked = !input.checked;
        var key = toggles[id];
        if (input.checked) { map.addLayer(layers[key]); } else { map.removeLayer(layers[key]); }
      });
      applySearch();
      syncCompanyUI(false);
      syncProjectsBox();
    });

    /* ---------------- Sidebar Resizing ---------------- */
    var sideEl = document.querySelector(".side");
    var resizerEl = document.getElementById("resizer");
    var SIDE_DEFAULT = 370;

    function applySideWidth(w) {
      w = Math.max(240, Math.min(640, Math.round(w)));
      sideEl.style.flexBasis = w + "px";
      sideEl.style.width = w + "px";
      try { localStorage.setItem("rvn_side_w", String(w)); } catch (e) {}
      map.invalidateSize();
    }

    var savedW = parseInt(localStorage.getItem("rvn_side_w") || String(SIDE_DEFAULT), 10);
    applySideWidth(isFinite(savedW) ? savedW : SIDE_DEFAULT);

    (function () {
      var dragging = false;
      resizerEl.addEventListener("pointerdown", function (e) {
        dragging = true;
        resizerEl.classList.add("active");
        document.body.style.userSelect = "none";
        try { resizerEl.setPointerCapture(e.pointerId); } catch (err) {}
        e.preventDefault();
      });
      resizerEl.addEventListener("pointermove", function (e) {
        if (!dragging) return;
        applySideWidth(e.clientX - sideEl.getBoundingClientRect().left);
      });
      function endDrag(e) {
        if (!dragging) return;
        dragging = false;
        resizerEl.classList.remove("active");
        document.body.style.userSelect = "";
        try { resizerEl.releasePointerCapture(e.pointerId); } catch (err) {}
      }
      resizerEl.addEventListener("pointerup", endDrag);
      resizerEl.addEventListener("pointercancel", endDrag);
      resizerEl.addEventListener("dblclick", function () { applySideWidth(SIDE_DEFAULT); });
    })();

    // Initial render — no company selected by default
    rebuildAll(false);

    setTimeout(function () { map.invalidateSize(); }, 200);
  })();
  </script>
  <script>
    // Light / dark toggle — the BlackBerry theme is dark by default.
    (function () {
      var btn = document.getElementById("themeBtn");
      if (!btn) return;
      btn.addEventListener("click", function () {
        var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        try { localStorage.setItem("pemap-theme", next); } catch (e) {}
      });
    })();
  </script>
  <script>
    // Top-right "Setting" popover — data sources, base map & advanced keys.
    (function () {
      var btn = document.getElementById("btn-settings");
      var pop = document.getElementById("settings-pop");
      var closeBtn = document.getElementById("settings-close");
      if (!btn || !pop) return;

      function setOpen(open) {
        pop.hidden = !open;
        btn.setAttribute("aria-expanded", open ? "true" : "false");
      }
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        setOpen(pop.hidden);
      });
      if (closeBtn) closeBtn.addEventListener("click", function () { setOpen(false); });
      document.addEventListener("click", function (e) {
        if (!pop.hidden && !pop.contains(e.target) && e.target !== btn) setOpen(false);
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") setOpen(false);
      });
    })();
  </script>
  <script>
    // The Energy Zone section is always shown; the Projects box can still be folded.
    Array.prototype.forEach.call(document.querySelectorAll(".side-body > details.card.always-open > summary"), function (s) {
      s.addEventListener("click", function (e) { e.preventDefault(); });
    });
  </script>
  <script>
    // Phones: the "Show / Close" button opens / closes the menu.
    // The "Energy Map" wordmark is a link back to the site home.
    (function () {
      var side = document.querySelector(".side");
      var toggle = document.getElementById("menu-toggle");
      if (!side || !toggle) return;
      toggle.addEventListener("click", function () {
        var open = !side.classList.contains("menu-open");
        side.classList.toggle("menu-open", open);
        toggle.textContent = open ? "Close" : "Show";
      });
    })();
  </script>
</body>
</html>
