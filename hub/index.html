    console.error('Failed to unpack protected application:', err);
    const loaderEl = document.getElementById('loader');
    if (loaderEl) {
      loaderEl.innerHTML = '<span style="color:#f87171;">Unable to load library. Please refresh.</span>';
    }
  }
})();
</script>
</body>
</html>
