<!DOCTYPE html>
<html lang="en" class="h-full bg-[#FAFAFA]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clean Energy Infrastructure</title>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            alabaster: '#FAFAFA',
            porcelain: '#F4F4F6',
            ink: '#0C0D0E',
            borderHairline: 'rgba(0, 0, 0, 0.07)',
          }
        }
      }
    }
  </script>

  <style>
    /* Architectural subtle warm grid */
    .bg-grid-architectural {
      background-size: 56px 56px;
      background-image: 
        linear-gradient(to right, rgba(0, 0, 0, 0.025) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.025) 1px, transparent 1px);
    }

    /* Spring micro-physics for portrait boxes */
    .portrait-card {
      transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1),
                  box-shadow 0.55s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.4s ease;
      will-change: transform, box-shadow;
    }
    
    .portrait-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 28px 50px -12px rgba(15, 23, 42, 0.08), 
                  0 1px 3px 0 rgba(0, 0, 0, 0.04);
    }

    /* Directional arrow hover translation */
    .portrait-card:hover .action-glyph {
      transform: translate(2px, -2px);
    }

    /* Subtle tinted backdrop blurs */
    .ambient-radial-glow {
      position: absolute;
      border-radius: 9999px;
      filter: blur(140px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }
  </style>
</head>

<body class="min-h-screen text-ink antialiased relative overflow-x-hidden flex flex-col justify-between p-6 sm:p-10 lg:p-14 bg-alabaster bg-grid-architectural font-sans selection:bg-black selection:text-white">

  <!-- Soft ambient architectural lighting -->
  <div class="ambient-radial-glow -top-32 left-1/4 w-[650px] h-[550px] bg-emerald-500/[0.04]"></div>
  <div class="ambient-radial-glow -bottom-32 right-1/4 w-[650px] h-[550px] bg-slate-400/[0.05]"></div>

  <!-- Header: Discrete Brand & Status -->
  <header class="relative z-10 w-full flex items-center justify-between pb-8 lg:pb-12">
    <div class="flex items-center space-x-3">
      <div class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]"></div>
      <span class="text-xs font-mono uppercase tracking-[0.32em] text-zinc-800 font-medium">VERDANT // INFRASTRUCTURE</span>
    </div>
    <div class="flex items-center space-x-2 text-[11px] font-mono tracking-widest text-zinc-600">
      <span>INDEX 03</span>
      <span class="text-zinc-400">/</span>
      <span>ACTIVE</span>
    </div>
  </header>

  <main class="relative z-10 flex-1 w-full max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6 lg:gap-8 items-stretch my-auto py-2">

    <!-- CARD 01: RENEWABLE MAP -->
    <a href="/map/" class="portrait-card group relative flex flex-col justify-between min-h-[500px] sm:min-h-[560px] lg:min-h-[640px] p-8 sm:p-10 lg:p-12 rounded-3xl bg-white border border-borderHairline shadow-[0_4px_24px_rgba(0,0,0,0.03)] overflow-hidden">
      <!-- Subtle internal tint on hover -->
      <div class="absolute inset-0 bg-gradient-to-b from-emerald-500/[0.025] to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none"></div>

      <!-- Top Section: Monospace Index -->
      <div class="relative z-10 flex items-center justify-between font-mono text-xs">
        <span class="text-zinc-600 tracking-widest font-medium group-hover:text-emerald-700 transition-colors">01</span>
        <span class="w-1.5 h-1.5 rounded-full bg-zinc-300 group-hover:bg-emerald-600 transition-colors"></span>
      </div>

      <!-- Center Section: Clean Minimal Line Icon -->
      <div class="relative z-10 my-auto flex justify-center">
        <div class="w-24 h-24 rounded-2xl bg-zinc-50 border border-zinc-100 flex items-center justify-center text-zinc-700 group-hover:text-emerald-700 group-hover:scale-105 group-hover:bg-emerald-500/[0.06] group-hover:border-emerald-500/20 transition-all duration-500">
          <svg class="w-11 h-11" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.25">
            <!-- Folded clean geospatial map -->
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 6.75V15m6-6v8.25m.503 3.498 4.875-2.437c.381-.19.622-.58.622-1.006V4.82c0-.836-.88-1.38-1.628-1.006l-3.869 1.934c-.317.159-.69.159-1.006 0L9.503 3.252a1.125 1.125 0 0 0-1.006 0L3.622 5.689C3.24 5.88 3 6.27 3 6.695V19.18c0 .836.88 1.38 1.628 1.006l3.869-1.934c.317-.159.69-.159 1.006 0l4.994 2.497c.317.158.69.158 1.006 0Z" />
            <circle cx="12" cy="10.5" r="1.5" stroke-linecap="round" stroke-width="1.3"/>
          </svg>
        </div>
      </div>

      <!-- Bottom Section: Domain Title & Explore Glyph -->
      <div class="relative z-10 flex items-end justify-between pt-6 border-t border-zinc-100">
        <div>
          <span class="block text-[10px] font-mono tracking-[0.25em] text-zinc-600 uppercase mb-1">Geospatial</span>
          <h2 class="text-2xl sm:text-3xl font-normal tracking-tight text-ink group-hover:text-emerald-950 transition-colors">
            Renewable Map
          </h2>
        </div>
        <div class="p-2.5 rounded-xl bg-zinc-50 border border-zinc-200/80 group-hover:bg-zinc-900 group-hover:border-zinc-900 transition-all duration-300">
          <svg class="action-glyph w-4 h-4 text-zinc-500 group-hover:text-white transition-all duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4.5 19.5l15-15m0 0H8.25m11.25 0v11.25"/>
          </svg>
        </div>
      </div>
    </a>

    <!-- CARD 02: EV CHARGING -->
    <a class="portrait-card group relative flex flex-col justify-between min-h-[500px] sm:min-h-[560px] lg:min-h-[640px] p-8 sm:p-10 lg:p-12 rounded-3xl bg-white border border-borderHairline shadow-[0_4px_24px_rgba(0,0,0,0.03)] overflow-hidden">
      <!-- Subtle internal tint on hover -->
      <div class="absolute inset-0 bg-gradient-to-b from-amber-500/[0.025] to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none"></div>

      <!-- Top Section: Monospace Index -->
      <div class="relative z-10 flex items-center justify-between font-mono text-xs">
        <span class="text-zinc-600 tracking-widest font-medium group-hover:text-amber-700 transition-colors">02</span>
        <span class="w-1.5 h-1.5 rounded-full bg-zinc-300 group-hover:bg-amber-600 transition-colors"></span>
      </div>

      <!-- Center Section: Clean Minimal Line Icon -->
      <div class="relative z-10 my-auto flex justify-center">
        <div class="w-24 h-24 rounded-2xl bg-zinc-50 border border-zinc-100 flex items-center justify-center text-zinc-700 group-hover:text-amber-700 group-hover:scale-105 group-hover:bg-amber-500/[0.06] group-hover:border-amber-500/20 transition-all duration-500">
          <svg class="w-11 h-11" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.25">
            <!-- Bolt energy transfer -->
            <path stroke-linecap="round" stroke-linejoin="round" d="m3.75 13.5 10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75Z" />
          </svg>
        </div>
      </div>

      <!-- Bottom Section: Domain Title & Explore Glyph -->
      <div class="relative z-10 flex items-end justify-between pt-6 border-t border-zinc-100">
        <div>
          <span class="block text-[10px] font-mono tracking-[0.25em] text-zinc-600 uppercase mb-1">Mobility</span>
          <h2 class="text-2xl sm:text-3xl font-normal tracking-tight text-ink group-hover:text-amber-950 transition-colors">
            EV Charging
          </h2>
        </div>
        <div class="p-2.5 rounded-xl bg-zinc-50 border border-zinc-200/80 group-hover:bg-zinc-900 group-hover:border-zinc-900 transition-all duration-300">
          <svg class="action-glyph w-4 h-4 text-zinc-500 group-hover:text-white transition-all duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4.5 19.5l15-15m0 0H8.25m11.25 0v11.25"/>
          </svg>
        </div>
      </div>
    </a>

    <!-- CARD 03: DATA CENTER -->
    <a class="portrait-card group relative flex flex-col justify-between min-h-[500px] sm:min-h-[560px] lg:min-h-[640px] p-8 sm:p-10 lg:p-12 rounded-3xl bg-white border border-borderHairline shadow-[0_4px_24px_rgba(0,0,0,0.03)] overflow-hidden">
      <!-- Subtle internal tint on hover -->
      <div class="absolute inset-0 bg-gradient-to-b from-indigo-500/[0.025] to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none"></div>

      <!-- Top Section: Monospace Index -->
      <div class="relative z-10 flex items-center justify-between font-mono text-xs">
        <span class="text-zinc-600 tracking-widest font-medium group-hover:text-indigo-700 transition-colors">03</span>
        <span class="w-1.5 h-1.5 rounded-full bg-zinc-300 group-hover:bg-indigo-600 transition-colors"></span>
      </div>

      <!-- Center Section: Clean Minimal Line Icon -->
      <div class="relative z-10 my-auto flex justify-center">
        <div class="w-24 h-24 rounded-2xl bg-zinc-50 border border-zinc-100 flex items-center justify-center text-zinc-700 group-hover:text-indigo-700 group-hover:scale-105 group-hover:bg-indigo-500/[0.06] group-hover:border-indigo-500/20 transition-all duration-500">
          <svg class="w-11 h-11" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.25">
            <!-- Server rack array -->
            <rect x="3" y="4" width="18" height="4.5" rx="1.2" stroke-linecap="round"/>
            <rect x="3" y="10" width="18" height="4.5" rx="1.2" stroke-linecap="round"/>
            <rect x="3" y="16" width="18" height="4.5" rx="1.2" stroke-linecap="round"/>
            <circle cx="6.5" cy="6.25" r="0.75" fill="currentColor"/>
            <circle cx="6.5" cy="12.25" r="0.75" fill="currentColor"/>
            <circle cx="6.5" cy="18.25" r="0.75" fill="currentColor"/>
            <line x1="16" y1="6.25" x2="18.5" y2="6.25" stroke-linecap="round"/>
            <line x1="16" y1="12.25" x2="18.5" y2="12.25" stroke-linecap="round"/>
            <line x1="16" y1="18.25" x2="18.5" y2="18.25" stroke-linecap="round"/>
          </svg>
        </div>
      </div>

      <!-- Bottom Section: Domain Title & Explore Glyph -->
      <div class="relative z-10 flex items-end justify-between pt-6 border-t border-zinc-100">
        <div>
          <span class="block text-[10px] font-mono tracking-[0.25em] text-zinc-600 uppercase mb-1">Compute</span>
          <h2 class="text-2xl sm:text-3xl font-normal tracking-tight text-ink group-hover:text-indigo-950 transition-colors">
            Data Center
          </h2>
        </div>
        <div class="p-2.5 rounded-xl bg-zinc-50 border border-zinc-200/80 group-hover:bg-zinc-900 group-hover:border-zinc-900 transition-all duration-300">
          <svg class="action-glyph w-4 h-4 text-zinc-500 group-hover:text-white transition-all duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4.5 19.5l15-15m0 0H8.25m11.25 0v11.25"/>
          </svg>
        </div>
      </div>
    </a>

  </main>

  <footer class="relative z-10 w-full flex flex-wrap gap-4 items-center justify-between text-[11px] font-mono text-zinc-600 pt-8 lg:pt-12">
    <div class="flex items-center space-x-2">
      <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
      <span class="tracking-wider">RENEWABLE MATRIX ONLINE</span>
    </div>
    <div class="flex items-center space-x-4">
      <a href="/blog/" class="tracking-widest hover:text-ink transition-colors">BLOG</a>
      <span class="tracking-widest">2026 ARCHITECTURE</span>
    </div>
  </footer>

</body>
</html>
