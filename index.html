<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Renewable Infrastructure</title>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN configured with class-based dark mode -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            alabaster: '#FAFAFA',
            obsidian: '#0A0C10',
            darkSurface: '#11141A',
            surface: '#FFFFFF',
          }
        }
      }
    }
  </script>

  <style>
    /* Architectural background grid pattern for light and dark modes */
    .bg-grid-architectural {
      background-size: 64px 64px;
      background-image: 
        linear-gradient(to right, rgba(0, 0, 0, 0.028) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.028) 1px, transparent 1px);
    }
    .dark .bg-grid-architectural {
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
    }

    /* Portrait card hover lift and border transitions */
    .portrait-card {
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                  box-shadow 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.4s ease,
                  background-color 0.4s ease;
      will-change: transform, box-shadow;
    }
    
    .portrait-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 32px 64px -16px rgba(0, 0, 0, 0.08), 
                  0 4px 16px -2px rgba(0, 0, 0, 0.03);
    }
    .dark .portrait-card:hover {
      box-shadow: 0 32px 64px -16px rgba(0, 0, 0, 0.5), 
                  0 0 24px -2px rgba(255, 255, 255, 0.04);
    }

    /* Double-scale icon pod smooth hover scale */
    .icon-pod {
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.35s ease,
                  background-color 0.35s ease,
                  color 0.35s ease,
                  box-shadow 0.4s ease;
    }

    .portrait-card:hover .icon-pod {
      transform: scale(1.05);
    }

    /* Arrow icon micro-displacement on card hover */
    .portrait-card:hover .action-glyph {
      transform: translate(2px, -2px);
    }
  </style>

  <!-- Prevent theme flicker before mount -->
  <script>
    if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
</head>

<body class="min-h-screen text-zinc-900 dark:text-zinc-100 antialiased relative overflow-x-hidden flex flex-col justify-between p-6 sm:p-10 lg:p-12 bg-alabaster dark:bg-obsidian bg-grid-architectural font-sans selection:bg-black selection:text-white dark:selection:bg-white dark:selection:text-black transition-colors duration-500">

  <header class="relative z-10 w-full flex items-center justify-between pb-8 lg:pb-10 max-w-7xl mx-auto">
    <div class="flex items-center space-x-3">
      <div class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]"></div>
      <h1 class="text-xs sm:text-sm font-mono uppercase tracking-[0.28em] text-zinc-800 dark:text-zinc-200 font-semibold">
        RENEWABLE INFRASTRUCTURE
      </h1>
    </div>

    <!-- Theme Switcher Button -->
    <button id="themeToggleBtn" aria-label="Toggle Theme" class="flex items-center justify-center w-10 h-10 rounded-2xl bg-white dark:bg-darkSurface border border-black/[0.06] dark:border-white/[0.1] shadow-[0_2px_10px_rgba(0,0,0,0.03)] hover:border-black/20 dark:hover:border-white/30 text-zinc-600 dark:text-zinc-300 transition-all duration-300 cursor-pointer">
      <!-- Sun Icon (Shown in Dark Mode) -->
      <svg id="sunIcon" class="hidden w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
      </svg>
      <!-- Moon Icon (Shown in Light Mode) -->
      <svg id="moonIcon" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
      </svg>
    </button>
  </header>

  <main class="relative z-10 flex-1 w-full max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6 lg:gap-8 items-stretch my-auto py-2">

    <!-- CARD 01: RENEWABLE MAP -->
    <a href="/map/" class="portrait-card group relative flex flex-col justify-between min-h-[620px] sm:min-h-[680px] lg:min-h-[740px] p-8 sm:p-10 lg:p-12 rounded-3xl bg-white dark:bg-darkSurface border border-black/[0.06] dark:border-white/[0.08] shadow-[0_2px_16px_rgba(0,0,0,0.02)] overflow-hidden">
      
      <!-- Top Section: Monospace Index -->
      <div class="flex items-center justify-between font-mono text-xs text-zinc-400 dark:text-zinc-500">
        <span class="tracking-widest font-medium text-zinc-500 dark:text-zinc-400 group-hover:text-emerald-600 dark:group-hover:text-emerald-400 transition-colors">01</span>
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500/80"></span>
      </div>

      <!-- Center Section: 1.5X Scaled Ceramic / Glass Pod with Line-Art Icon -->
      <div class="flex flex-col items-center justify-center my-auto py-8">
        <div class="icon-pod w-44 h-44 sm:w-48 sm:h-48 rounded-[2.25rem] bg-[#FAFAFA] dark:bg-white/[0.03] border border-black/[0.06] dark:border-white/[0.08] flex items-center justify-center text-zinc-700 dark:text-zinc-300 shadow-[0_8px_30px_rgba(0,0,0,0.03)] group-hover:text-emerald-600 dark:group-hover:text-emerald-400 group-hover:bg-white dark:group-hover:bg-white/[0.06] group-hover:border-emerald-500/30 dark:group-hover:border-emerald-500/30">
          <svg class="w-24 h-24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.1">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 6.75V15m6-6v8.25m.503 3.498 4.875-2.437c.381-.19.622-.58.622-1.006V4.82c0-.836-.88-1.38-1.628-1.006l-3.869 1.934c-.317.159-.69.159-1.006 0L9.503 3.252a1.125 1.125 0 0 0-1.006 0L3.622 5.689C3.24 5.88 3 6.27 3 6.695V19.18c0 .836.88 1.38 1.628 1.006l3.869-1.934c.317-.159.69-.159 1.006 0l4.994 2.497c.317.158.69.158 1.006 0Z" />
            <circle cx="12" cy="10" r="1.75" stroke-linecap="round"/>
          </svg>
        </div>
      </div>

      <!-- Bottom Section: Domain Title & Arrow -->
      <div class="flex items-end justify-between pt-6 border-t border-black/[0.06] dark:border-white/[0.08]">
        <div>
          <h2 class="text-2xl lg:text-[28px] font-light tracking-tight text-zinc-900 dark:text-zinc-100 group-hover:text-emerald-600 dark:group-hover:text-emerald-400 transition-colors">
            Renewable Map
          </h2>
        </div>
        <div class="p-2.5 rounded-xl bg-[#F7F7F8] dark:bg-white/[0.04] border border-zinc-200/60 dark:border-white/[0.08] group-hover:bg-zinc-900 dark:group-hover:bg-white group-hover:border-zinc-900 dark:group-hover:border-white transition-all duration-300">
          <svg class="action-glyph w-4 h-4 text-zinc-500 dark:text-zinc-400 group-hover:text-white dark:group-hover:text-black transition-all duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4.5 19.5l15-15m0 0H8.25m11.25 0v11.25"/>
          </svg>
        </div>
      </div>
    </a>

    <!-- CARD 02: EV CHARGING -->
    <a class="portrait-card group relative flex flex-col justify-between min-h-[620px] sm:min-h-[680px] lg:min-h-[740px] p-8 sm:p-10 lg:p-12 rounded-3xl bg-white dark:bg-darkSurface border border-black/[0.06] dark:border-white/[0.08] shadow-[0_2px_16px_rgba(0,0,0,0.02)] overflow-hidden">
      
      <!-- Top Section: Monospace Index -->
      <div class="flex items-center justify-between font-mono text-xs text-zinc-400 dark:text-zinc-500">
        <span class="tracking-widest font-medium text-zinc-500 dark:text-zinc-400 group-hover:text-amber-600 dark:group-hover:text-amber-400 transition-colors">02</span>
        <span class="w-1.5 h-1.5 rounded-full bg-amber-500/80"></span>
      </div>

      <!-- Center Section: 1.5X Scaled Ceramic / Glass Pod with Line-Art Icon -->
      <div class="flex flex-col items-center justify-center my-auto py-8">
        <div class="icon-pod w-44 h-44 sm:w-48 sm:h-48 rounded-[2.25rem] bg-[#FAFAFA] dark:bg-white/[0.03] border border-black/[0.06] dark:border-white/[0.08] flex items-center justify-center text-zinc-700 dark:text-zinc-300 shadow-[0_8px_30px_rgba(0,0,0,0.03)] group-hover:text-amber-600 dark:group-hover:text-amber-400 group-hover:bg-white dark:group-hover:bg-white/[0.06] group-hover:border-amber-500/30 dark:group-hover:border-amber-500/30">
          <svg class="w-24 h-24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.1">
            <path stroke-linecap="round" stroke-linejoin="round" d="m3.75 13.5 10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75Z" />
          </svg>
        </div>
      </div>

      <!-- Bottom Section: Domain Title & Arrow -->
      <div class="flex items-end justify-between pt-6 border-t border-black/[0.06] dark:border-white/[0.08]">
        <div>
          <h2 class="text-2xl lg:text-[28px] font-light tracking-tight text-zinc-900 dark:text-zinc-100 group-hover:text-amber-600 dark:group-hover:text-amber-400 transition-colors">
            EV Charging
          </h2>
        </div>
        <div class="p-2.5 rounded-xl bg-[#F7F7F8] dark:bg-white/[0.04] border border-zinc-200/60 dark:border-white/[0.08] group-hover:bg-zinc-900 dark:group-hover:bg-white group-hover:border-zinc-900 dark:group-hover:border-white transition-all duration-300">
          <svg class="action-glyph w-4 h-4 text-zinc-500 dark:text-zinc-400 group-hover:text-white dark:group-hover:text-black transition-all duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4.5 19.5l15-15m0 0H8.25m11.25 0v11.25"/>
          </svg>
        </div>
      </div>
    </a>

    <!-- CARD 03: DATA CENTER -->
    <a href="/datacenter/" class="portrait-card group relative flex flex-col justify-between min-h-[620px] sm:min-h-[680px] lg:min-h-[740px] p-8 sm:p-10 lg:p-12 rounded-3xl bg-white dark:bg-darkSurface border border-black/[0.06] dark:border-white/[0.08] shadow-[0_2px_16px_rgba(0,0,0,0.02)] overflow-hidden">
      
      <!-- Top Section: Monospace Index -->
      <div class="flex items-center justify-between font-mono text-xs text-zinc-400 dark:text-zinc-500">
        <span class="tracking-widest font-medium text-zinc-500 dark:text-zinc-400 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors">03</span>
        <span class="w-1.5 h-1.5 rounded-full bg-indigo-500/80"></span>
      </div>

      <!-- Center Section: 1.5X Scaled Ceramic / Glass Pod with Line-Art Icon -->
      <div class="flex flex-col items-center justify-center my-auto py-8">
        <div class="icon-pod w-44 h-44 sm:w-48 sm:h-48 rounded-[2.25rem] bg-[#FAFAFA] dark:bg-white/[0.03] border border-black/[0.06] dark:border-white/[0.08] flex items-center justify-center text-zinc-700 dark:text-zinc-300 shadow-[0_8px_30px_rgba(0,0,0,0.03)] group-hover:text-indigo-600 dark:group-hover:text-indigo-400 group-hover:bg-white dark:group-hover:bg-white/[0.06] group-hover:border-indigo-500/30 dark:group-hover:border-indigo-500/30">
          <svg class="w-24 h-24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.1">
            <rect x="3" y="3.5" width="18" height="4.5" rx="1.2" stroke-linecap="round"/>
            <rect x="3" y="9.75" width="18" height="4.5" rx="1.2" stroke-linecap="round"/>
            <rect x="3" y="16" width="18" height="4.5" rx="1.2" stroke-linecap="round"/>
            <circle cx="6.5" cy="5.75" r="0.75" fill="currentColor"/>
            <circle cx="6.5" cy="12" r="0.75" fill="currentColor"/>
            <circle cx="6.5" cy="18.25" r="0.75" fill="currentColor"/>
            <line x1="16" y1="5.75" x2="18.5" y2="5.75" stroke-linecap="round"/>
            <line x1="16" y1="12" x2="18.5" y2="12" stroke-linecap="round"/>
            <line x1="16" y1="18.25" x2="18.5" y2="18.25" stroke-linecap="round"/>
          </svg>
        </div>
      </div>

      <!-- Bottom Section: Domain Title & Arrow -->
      <div class="flex items-end justify-between pt-6 border-t border-black/[0.06] dark:border-white/[0.08]">
        <div>
          <h2 class="text-2xl lg:text-[28px] font-light tracking-tight text-zinc-900 dark:text-zinc-100 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors">
            Data Center
          </h2>
        </div>
        <div class="p-2.5 rounded-xl bg-[#F7F7F8] dark:bg-white/[0.04] border border-zinc-200/60 dark:border-white/[0.08] group-hover:bg-zinc-900 dark:group-hover:bg-white group-hover:border-zinc-900 dark:group-hover:border-white transition-all duration-300">
          <svg class="action-glyph w-4 h-4 text-zinc-500 dark:text-zinc-400 group-hover:text-white dark:group-hover:text-black transition-all duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4.5 19.5l15-15m0 0H8.25m11.25 0v11.25"/>
          </svg>
        </div>
      </div>
    </a>

  </main>

  <footer class="relative z-10 w-full flex items-center justify-center text-xs font-mono text-zinc-400 dark:text-zinc-500 pt-8 lg:pt-10 max-w-7xl mx-auto tracking-wider">
    <a href="https://renewablevietnam.com" target="_blank" rel="noopener noreferrer" class="hover:text-zinc-700 dark:hover:text-zinc-300 transition-colors">
      @renewablevietnam.com
    </a>
  </footer>

  <script>
    // Theme toggle handler with localStorage and DOM synchronization
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');

    function updateIcons() {
      const isDark = document.documentElement.classList.contains('dark');
      if (isDark) {
        sunIcon.classList.remove('hidden');
        moonIcon.classList.add('hidden');
      } else {
        sunIcon.classList.add('hidden');
        moonIcon.classList.remove('hidden');
      }
    }

    // Initialize initial icon state
    updateIcons();

    // Toggle event listener
    themeToggleBtn.addEventListener('click', () => {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      updateIcons();
    });
  </script>

</body>
</html>
