    <script id="rvn-prepaint-theme">

      try {
        var m = document.cookie.match(/(?:^|;\s*)rvn_theme=(dark|light)/);

        document.documentElement.classList.toggle('dark', t === 'dark');
      } catch (e) {}
    })();

<body class="min-h-screen flex flex-col antialiased">

  <!-- Master Top Navigation Bar -->
  <header id="rvn-header" data-active="project"></header>
  <script src="/assets/js/rvn-header.js?v=1"></script>
  <section class="bg-white/95 dark:bg-slate-900/95 border-b border-slate-200/80 dark:border-slate-800 shadow-xs">
    <div class="w-full max-w-[1920px] 2xl:max-w-full mx-auto px-4 sm:px-6 lg:px-8 xl:px-12 py-2 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 min-w-0">
        <span class="text-[11px] font-mono uppercase tracking-wider text-slate-700 dark:text-slate-200 font-semibold truncate">Garments Capital Projects</span>
        <span class="hidden sm:inline-flex items-center gap-1.5 px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-800 border border-slate-200/60 dark:border-slate-700/50 font-mono text-[10px] text-slate-600 dark:text-slate-400">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
          <span>$14.50M BAC &middot; Multi-Site</span>
        </span>
      </div>
      <a href="https://renewablevietnam.com/project/" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md bg-sky-50 dark:bg-sky-950/40 border border-sky-200 dark:border-sky-800 text-sky-700 dark:text-sky-300 hover:bg-sky-100 text-[11px] font-semibold transition-colors shadow-2xs shrink-0">&larr; Projects Home</a>
    </div>
    <!-- Executive 7-Segment Grid Navigation -->
    <div class="w-full max-w-[1920px] 2xl:max-w-full mx-auto px-4 sm:px-6 lg:px-8 xl:px-12 border-t border-slate-100 dark:border-slate-800/80 py-2.5">
      <nav id="module-nav-bar" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-2">
        <!-- Rendered dynamically -->
      </nav>
    </div>
    <!-- Active Viewport Toolbar -->
    <div class="bg-slate-50/80 dark:bg-slate-900/60 border-t border-slate-200/80 dark:border-slate-800 px-4 sm:px-6 lg:px-8 xl:px-12 py-2 text-xs">
      <div class="w-full max-w-[1920px] 2xl:max-w-full mx-auto flex flex-col sm:flex-row sm:items-center justify-between gap-1.5 sm:gap-2 text-slate-600 dark:text-slate-400">
        <div class="flex items-center gap-2 min-w-0">
          <span class="w-2 h-2 rounded-full bg-sky-500 shrink-0"></span>
          <span class="text-slate-400 dark:text-slate-500 uppercase font-semibold text-[9.5px] sm:text-[10px] shrink-0">Active Module:</span>
          <strong id="active-module-title" class="text-slate-900 dark:text-slate-100 font-bold text-xs truncate">Loading...</strong>
        </div>
        <a id="open-standalone-link" href="#" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sky-700 dark:text-sky-300 font-medium hover:bg-sky-50 dark:hover:bg-slate-700 transition-colors shadow-2xs text-[11px] shrink-0 self-end sm:self-auto">

      </div>

  <!-- Module Content Container -->
  <main class="flex-1 w-full max-w-[1920px] 2xl:max-w-full mx-auto px-2 py-2 sm:px-6 sm:py-4">
    <iframe id="module-viewport" class="module-frame" src="modules/bod_capex_charter_report.html" title="Engineering Module Viewport"></iframe>
  </main>

  <!-- Master Footer -->
  <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-4 text-center text-xs text-slate-500 dark:text-slate-400">
    Garments Company Regional Engineering &amp; Capital Projects Architecture | Multi-Site Governance (Vietnam &amp; Sri Lanka)
  </footer>

  <script src="./modules_Rev_Final.js"></script>
  <script>
    let activeModuleId = null;

    function renderNavigationBar() {
      const navBar = document.getElementById("module-nav-bar");
      if (!navBar || !window.PORTAL_MODULES) return;
      navBar.innerHTML = "";

      window.PORTAL_MODULES.forEach((mod) => {
        const btn = document.createElement("button");
        btn.id = `btn-${mod.id}`;
        btn.onclick = () => loadModule(mod.id);
        btn.className = "flex flex-col items-start p-2 rounded-lg border text-left transition-all duration-150 relative bg-white dark:bg-slate-800/80 border-slate-200 dark:border-slate-700/80 hover:border-sky-300 hover:shadow-xs group cursor-pointer";
        
        btn.innerHTML = `
          <div class="flex items-center justify-between w-full mb-1">
            <span class="text-[9px] font-mono font-bold tracking-wider uppercase text-slate-500 dark:text-slate-400 group-hover:text-sky-600 transition-colors">${mod.tag}</span>
            <span class="text-[8.5px] px-1 py-0.5 rounded font-medium bg-slate-100 dark:bg-slate-700/60 text-slate-600 dark:text-slate-300 border border-slate-200/60 dark:border-slate-600/50">${mod.badge}</span>
          </div>
          <span class="text-[11px] font-bold text-slate-800 dark:text-slate-200 leading-snug line-clamp-1 group-hover:text-sky-600 transition-colors">${mod.shortTitle}</span>
          <span class="text-[9.5px] text-slate-400 dark:text-slate-500 leading-tight line-clamp-1 mt-0.5">${mod.category}</span>
        `;
        navBar.appendChild(btn);
      });
    }

    function loadModule(moduleId) {
      const mod = window.PORTAL_MODULES.find(m => m.id === moduleId);
      if (!mod) return;
      activeModuleId = moduleId;

      document.getElementById("active-module-title").textContent = mod.title;
      document.getElementById("open-standalone-link").href = mod.file;

      const viewport = document.getElementById("module-viewport");
      viewport.style.opacity = "0.2";
      viewport.src = mod.file;
      viewport.onload = () => {
        viewport.style.opacity = "1";
      };

      window.PORTAL_MODULES.forEach(m => {
        const btn = document.getElementById(`btn-${m.id}`);
        if (!btn) return;
        if (m.id === moduleId) {
          btn.className = "flex flex-col items-start p-2 rounded-lg border text-left transition-all duration-150 relative bg-sky-50/90 dark:bg-sky-950/40 border-sky-400 dark:border-sky-500 shadow-xs ring-1 ring-sky-400/30";
        } else {
          btn.className = "flex flex-col items-start p-2 rounded-lg border text-left transition-all duration-150 relative bg-white dark:bg-slate-800/80 border-slate-200 dark:border-slate-700/80 hover:border-sky-300 hover:shadow-xs group cursor-pointer";
        }
      });

      if (window.location.hash.slice(1) !== moduleId) {
        history.replaceState(null, null, `#${moduleId}`);
      }
    }

    // Theme managed by /assets/js/rvn-header.js

    window.addEventListener("DOMContentLoaded", () => {
      renderNavigationBar();
      const initialModule = window.location.hash.slice(1) || "charter_report";
      loadModule(initialModule);
    });
  </script>
</body>
