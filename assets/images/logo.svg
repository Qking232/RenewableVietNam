<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="symCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00A3FF" />
    </linearGradient>
    <linearGradient id="symBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0080FF" />
      <stop offset="100%" stop-color="#0055B3" />
    </linearGradient>
  </defs>

  <!-- Hardware Squircle Casing -->
  <rect width="128" height="128" rx="28" fill="url(#bgDark)" stroke="#334155" stroke-width="1.5" />

  <!-- Centered Scaled Symbol -->
  <g transform="translate(64, 64) scale(1.15)">
    <!-- Branch 1: Electric Cyan -->
    <g transform="rotate(0)">
      <rect x="7" y="-32" width="22" height="9" rx="4.5" fill="url(#symCyan)" />
      <rect x="15" y="-20" width="18" height="8.5" rx="4.25" fill="#38BDF8" />
      <rect x="25" y="-9" width="11" height="8" rx="4" transform="rotate(25 30.5 -5)" fill="url(#symCyan)" />
    </g>

    <!-- Branch 2: Tech Blue -->
    <g transform="rotate(120)">
      <rect x="7" y="-32" width="22" height="9" rx="4.5" fill="url(#symBlue)" />
      <rect x="15" y="-20" width="18" height="8.5" rx="4.25" fill="#0070E0" />
      <rect x="25" y="-9" width="11" height="8" rx="4" transform="rotate(25 30.5 -5)" fill="url(#symBlue)" />
    </g>

    <!-- Branch 3: Deep Slate/Cobalt Accent -->
    <g transform="rotate(240)">
      <rect x="7" y="-32" width="22" height="9" rx="4.5" fill="#0284C7" />
      <rect x="15" y="-20" width="18" height="8.5" rx="4.25" fill="#0369A1" />
      <rect x="25" y="-9" width="11" height="8" rx="4" transform="rotate(25 30.5 -5)" fill="#075985" />
    </g>

    <!-- Center Trackpad -->
    <circle cx="0" cy="0" r="5" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
  </g>
</svg>
