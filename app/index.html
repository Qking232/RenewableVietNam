<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>platapp — micro html & vibe coding</title>
  <meta name="description" content="A minimal, fast platform for discovering, playing, and sharing single-file HTML micro-apps.">
  <style>
    :root {
      --bg: #09090b;
      --surface: #121215;
      --surface-hover: #18181d;
      --surface-active: #22222a;
      --border: #222227;
      --border-focus: #3b82f6;
      --text: #fafafa;
      --text-muted: #8b8b99;
      --text-dim: #5c5c6b;
      --accent: #ffffff;
      --accent-bg: #1c1c24;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      letter-spacing: -0.2px;
    }

    /* Minimalist Top Nav Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(9, 9, 11, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 54px;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text);
      font-weight: 600;
      font-size: 16px;
      user-select: none;
    }

    .brand-logo-icon {
      width: 22px;
      height: 22px;
      border: 1.5px solid #fff;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .brand-logo-icon::after {
      content: "";
      width: 6px;
      height: 6px;
      background: #fff;
      border-radius: 1px;
    }

    .brand-tag {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-dim);
      padding: 1px 6px;
      border-radius: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    /* Minimalist Search */
    .search-wrapper {
      flex: 1;
      max-width: 440px;
      position: relative;
    }

    .search-input {
      width: 100%;
      height: 34px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 34px 0 12px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }

    .search-input:focus {
      border-color: #555566;
      background: #15151a;
    }

    .search-icon {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 11px;
      color: var(--text-dim);
      pointer-events: none;
      border: 1px solid var(--border);
      padding: 2px 5px;
      border-radius: 4px;
    }

    /* Header Actions */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      transition: all 0.15s;
      user-select: none;
    }

    .btn:hover {
      background: var(--surface-hover);
      border-color: #383842;
    }

    .btn-primary {
      background: #fafafa;
      color: #09090b;
      border-color: #fafafa;
      font-weight: 600;
    }

    .btn-primary:hover {
      background: #e4e4e7;
      border-color: #e4e4e7;
    }

    /* Categories Tab Bar */
    .tabs-bar {
      display: flex;
      gap: 6px;
      padding: 10px 24px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .tab-item {
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .tab-item:hover {
      color: var(--text);
      background: var(--surface);
    }

    .tab-item.active {
      color: var(--text);
      background: var(--surface-hover);
      border: 1px solid var(--border);
      font-weight: 600;
    }

    
    .card-thumb-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.25s ease;
    }
    .app-card:hover .card-thumb-img {
      transform: scale(1.04);
    }
    .snap-toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #18181b;
      border: 1px solid #38bdf8;
      color: #fafafa;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      z-index: 500;
      display: none;
      align-items: center;
      gap: 8px;
    }

    
    .mini-stage-box {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      background: #09090b;
    }
    .mini-stage-frame {
      width: 800px;
      height: 450px;
      border: none;
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      pointer-events: none;
      background: #0d0d12;
      opacity: 0.95;
    }

    /* Main Container */
    main {
      flex: 1;
      padding: 24px;
      max-width: 1500px;
      width: 100%;
      margin: 0 auto;
    }

    /* Feed Grid */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
    }

    .app-card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s;
      overflow: hidden;
    }

    .app-card:hover {
      border-color: #383842;
      transform: translateY(-2px);
    }

    .card-canvas-box {
      width: 100%;
      aspect-ratio: 16/9;
      background: #0d0d10;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .card-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(18, 18, 21, 0.85);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .card-glyph {
      font-size: 32px;
      opacity: 0.85;
    }

    .card-body {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-author {
      font-size: 12px;
      color: var(--text-dim);
    }

    .card-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-top: 2px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.04);
    }

    .btn-play-action {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-play-action:hover {
      background: var(--surface-hover);
      border-color: #444450;
    }

    .btn-icon-only {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 13px;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      transition: color 0.15s;
    }

    .btn-icon-only:hover {
      color: #ff5555;
    }

    /* Player View */
    .player-view {
      display: none;
      flex-direction: column;
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .player-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn-back {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border-radius: 5px;
    }

    .btn-back:hover {
      color: var(--text);
      background: var(--surface);
    }

    /* Stage Wrapper */
    .stage-wrapper {
      position: relative;
      background: #000;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      width: 100%;
      aspect-ratio: 16/9;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: aspect-ratio 0.2s ease;
    }

    .stage-wrapper.aspect-1-1 { aspect-ratio: 1/1; max-width: 650px; margin: 0 auto; }
    .stage-wrapper.aspect-9-16 { aspect-ratio: 9/16; max-width: 400px; margin: 0 auto; }
    .stage-wrapper.aspect-full { aspect-ratio: auto; height: 80vh; }

    iframe#vibeStage {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }

    /* Compact Toolbar */
    .player-toolbar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tool-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
    }

    .tool-btn:hover {
      background: var(--surface-hover);
      color: var(--text);
      border-color: var(--border);
    }

    /* Player Details */
    .player-details {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 20px;
    }

    @media (max-width: 860px) {
      .player-details { grid-template-columns: 1fr; }
    }

    .player-meta-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .player-title {
      font-size: 18px;
      font-weight: 600;
    }

    .player-subline {
      font-size: 12px;
      color: var(--text-dim);
      display: flex;
      gap: 12px;
    }

    .prompt-container {
      background: #0d0d10;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
    }

    .prompt-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .prompt-text {
      font-size: 12px;
      font-family: monospace;
      color: #ccc;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Up Next Mini List */
    .up-next-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mini-card {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .mini-card:hover {
      background: var(--surface-hover);
      border-color: #383842;
    }

    .mini-glyph {
      font-size: 18px;
      flex-shrink: 0;
    }

    .mini-title {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Modals */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 16px 40px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    .modal-head {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
    }

    .modal-close-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 16px;
      cursor: pointer;
    }

    .modal-content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-field label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .input-field {
      background: #0c0c0f;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }

    .input-field:focus {
      border-color: #555566;
    }

    /* Drag Overlay */
    #dropZoneOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(9, 9, 11, 0.94);
      border: 2px dashed #444455;
      z-index: 300;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    #dropZoneOverlay.active {
      display: flex;
      pointer-events: all;
    }

    /* Code View Pre */
    .code-view {
      background: #09090c;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: #93c5fd;
      max-height: 55vh;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <!-- Drag-and-drop overlay -->
  <div id="dropZoneOverlay">
    <div style="font-size: 32px;">⧉</div>
    <div style="font-weight: 600; font-size: 16px;">Drop .html file to launch</div>
    <div style="font-size: 12px; color: var(--text-muted);">Instant isolated sandbox & local save</div>
  </div>

  <!-- Header -->
  <header>
    <a href="#/" class="brand" id="brandLogo">
      <div class="brand-logo-icon"></div>
      <div>platapp</div>
      <div class="brand-tag">vibe</div>
    </a>

    <div class="search-wrapper">
      <input type="text" id="searchInput" class="search-input" placeholder="Search apps, games, synths..." />
      <span class="search-icon">/</span>
    </div>

    <div class="header-actions">
      <input type="file" id="filePicker" accept=".html,.htm" style="display: none;" />
      <button class="btn btn-primary" id="uploadBtn">
        + Upload
      </button>
    </div>
  </header>

  <!-- Category Tabs -->
  <div class="tabs-bar" id="tabsBar">
    <div class="tab-item active" data-cat="all">All</div>
    <div class="tab-item" data-cat="game">Games</div>
    <div class="tab-item" data-cat="visual">Visuals</div>
    <div class="tab-item" data-cat="audio">Audio</div>
    <div class="tab-item" data-cat="tool">Tools</div>
  </div>

  <!-- Main View Area -->
  <main>
    <!-- Feed Section -->
    <section id="feedSection">
      <div class="app-grid" id="appGrid"></div>
    </section>

    <!-- Player Stage Section -->
    <section id="playerSection" class="player-view">
      <div class="player-header">
        <button class="btn-back" id="btnBackToFeed">
          ← Back
        </button>
        <span id="playerCategoryTag" class="card-badge" style="position: static;">APP</span>
      </div>

      <!-- Stage -->
      <div class="stage-wrapper" id="stageWrapper">
        <iframe id="vibeStage" sandbox="allow-scripts allow-forms allow-modals allow-downloads allow-pointer-lock"></iframe>
      </div>

      <!-- Compact Controls Toolbar -->
      <div class="player-toolbar">
        <div class="tool-group">
          <button class="tool-btn" id="btnRestart" title="Restart">🔄 Restart</button>
          <button class="tool-btn" id="btnAspect" title="Aspect ratio">📐 16:9</button>
          <button class="tool-btn" id="btnSnapshot" title="Snapshot Frame as Thumbnail">📸 Snapshot</button>
          <button class="tool-btn" id="btnFullscreen" title="Fullscreen">⛶ Fullscreen</button>
        </div>

        <div class="tool-group">
          <button class="tool-btn" id="btnViewCode" title="View Code">💻 Code</button>
          <button class="tool-btn" id="btnExport" title="Export .html">⬇️ Export</button>
          <button class="tool-btn" id="btnDelete" style="color: #ef4444;" title="Delete">🗑️ Delete</button>
        </div>
      </div>

      <!-- Metadata & Recommendations -->
      <div class="player-details">
        <div class="player-meta-card">
          <div class="player-title" id="stageTitle">Title</div>
          <div class="player-subline">
            <span id="stageAuthor">By Author</span>
            <span>&bull;</span>
            <span id="stagePlays">0 plays</span>
          </div>
          <div id="stageDesc" style="font-size: 13px; color: var(--text-muted); line-height: 1.5;"></div>

          <div class="prompt-container" id="stagePromptBox">
            <div class="prompt-label">Prompt Recipe</div>
            <div class="prompt-text" id="stagePrompt"></div>
          </div>
        </div>

        <!-- Up Next -->
        <div class="up-next-box">
          <div style="font-size: 12px; font-weight: 600; color: var(--text-dim); text-transform: uppercase;">Up Next</div>
          <div id="upNextContainer" style="display: flex; flex-direction: column; gap: 6px;"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- View Code Modal -->
  <div class="modal-backdrop" id="codeModal">
    <div class="modal-panel" style="max-width: 720px;">
      <div class="modal-head">
        <span id="codeModalTitle">Source Code</span>
        <button class="modal-close-btn" id="closeCodeModal">&times;</button>
      </div>
      <div class="modal-content">
        <button class="btn" id="copyCodeBtn" style="align-self: flex-start;">📋 Copy Code</button>
        <pre class="code-view" id="codePre"></pre>
      </div>
    </div>
  </div>

  <!-- Upload Modal -->
  <div class="modal-backdrop" id="uploadModal">
    <div class="modal-panel">
      <div class="modal-head">
        <span>Upload HTML App</span>
        <button class="modal-close-btn" id="closeUploadModal">&times;</button>
      </div>
      <div class="modal-content">
        <div class="form-field">
          <label>Title</label>
          <input type="text" id="upTitle" class="input-field" placeholder="App Title" />
        </div>
        <div class="form-field">
          <label>Category</label>
          <select id="upCategory" class="input-field">
            <option value="visual">Visuals</option>
            <option value="game">Games</option>
            <option value="audio">Audio</option>
            <option value="tool">Tools</option>
          </select>
        </div>
        <div class="form-field">
          <label>Description</label>
          <input type="text" id="upDesc" class="input-field" placeholder="Brief description" />
        </div>
        <div class="form-field">
          <label>Prompt Recipe (optional)</label>
          <textarea id="upPrompt" class="input-field" style="min-height: 70px; resize: vertical;" placeholder="AI prompt used to code this..."></textarea>
        </div>
        <button class="btn btn-primary" id="saveUploadBtn" style="justify-content: center; margin-top: 6px;">
          Save & Launch
        </button>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================
       1. 95%+ UNIVERSAL COMPATIBILITY ENGINE
       ========================================================== */
    const CompatibilityEngine = {
      normalizeHtml(rawHtml, title = 'Vibe App') {
        let code = rawHtml.trim();
        const hasDoctype = /<!doctype\s+html/i.test(code);
        const hasHtmlTag = /<html[\s>]/i.test(code);

        const audioShim = `
<script>
  (function() {
    const unlock = () => {
      if (window.AudioContext || window.webkitAudioContext) {
        const ctx = window._vCtx || new (window.AudioContext || window.webkitAudioContext)();
        window._vCtx = ctx;
        if (ctx.state === 'suspended') ctx.resume();
      }
    };
    ['pointerdown', 'touchstart', 'click', 'keydown'].forEach(ev => {
      window.addEventListener(ev, unlock, { once: true, passive: true });
    });

    window.addEventListener('message', (ev) => {
      if (ev.data === 'CAPTURE_THUMBNAIL') {
        const cvs = document.querySelector('canvas');
        if (cvs) {
          try {
            const url = cvs.toDataURL('image/webp', 0.85);
            window.parent.postMessage({ type: 'THUMBNAIL_CAPTURED', dataUrl: url }, '*');
          } catch(err) {
            try {
              window.parent.postMessage({ type: 'THUMBNAIL_CAPTURED', dataUrl: cvs.toDataURL('image/png') }, '*');
            } catch(e2) {
              window.parent.postMessage({ type: 'THUMBNAIL_CAPTURED', dataUrl: null }, '*');
            }

      parseMeta(content, filename = 'Untitled App') {
        const doc = new DOMParser().parseFromString(content, 'text/html');
        const title = doc.querySelector('title')?.innerText?.trim() || filename.replace(/\.html?$/i, '');
        const desc = doc.querySelector('meta[name="description"]')?.getAttribute('content')?.trim() || 'A single-file HTML micro-app.';
        const promptMatch = content.match(/<!--\s*prompt:\s*([\s\S]*?)-->/i);

        const lower = content.toLowerCase();
        if (lower.includes('game') || lower.includes('paddle') || lower.includes('score')) category = 'game';

    const DB = {
      dbName: 'PlatappDB',
      version: 1,
      db: null,

      async init() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(this.dbName, this.version);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('apps')) {
              db.createObjectStore('apps', { keyPath: 'id' });
            }
          };
          req.onsuccess = (e) => {
            this.db = e.target.result;
            resolve(this.db);
          };
          req.onerror = (e) => reject(e);
        });
      },

      async getAllApps() {
        return new Promise((resolve) => {
          const tx = this.db.transaction('apps', 'readonly');
          const store = tx.objectStore('apps');
          const req = store.getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve([]);
        });
      },

      async getApp(id) {
        return new Promise((resolve) => {
          const tx = this.db.transaction('apps', 'readonly');
          const store = tx.objectStore('apps');
          const req = store.get(id);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      },

      async saveApp(app) {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction('apps', 'readwrite');
          const store = tx.objectStore('apps');
          const req = store.put(app);
          req.onsuccess = () => resolve(app);
          req.onerror = (e) => reject(e);
        });
      },

      async deleteApp(id) {
        return new Promise((resolve) => {
          const tx = this.db.transaction('apps', 'readwrite');
          const store = tx.objectStore('apps');
          const req = store.delete(id);
          req.onsuccess = () => resolve(true);
          req.onerror = () => resolve(false);

      renderFeed() {
        const grid = document.getElementById('appGrid');
        grid.innerHTML = '';

        const list = this.apps.filter(a => {
          const catOk = this.currentCat === 'all' || a.category === this.currentCat;
          const searchOk = !this.searchQuery ||
            a.title.toLowerCase().includes(this.searchQuery) ||
            a.description.toLowerCase().includes(this.searchQuery) ||
            a.category.toLowerCase().includes(this.searchQuery);
          return catOk && searchOk;
        });

        if (list.length === 0) {
          grid.innerHTML = `
            <div style="grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-dim);">
              <div style="font-size: 32px; margin-bottom: 8px;">⧉</div>
              <div>No apps found</div>
            </div>
          `;
          return;
        }

        list.forEach(app => {
          const card = document.createElement('div');
          card.className = 'app-card';
          card.onclick = () => this.openWatch(app.id);

          const glyph = app.glyph || (app.category === 'game' ? '🎮' : app.category === 'audio' ? '🎵' : app.category === 'tool' ? '🛠️' : '✨');

          let thumbHtml = '';
          if (app.thumbnail) {
            thumbHtml = `<img src="${app.thumbnail}" class="card-thumb-img" alt="${app.title}" />`;
          } else if (app.code) {
            // Live Scaled Sandboxed Mini-Stage Preview
            const normalized = CompatibilityEngine.normalizeHtml(app.code, app.title);
            const blob = new Blob([normalized], { type: 'text/html;charset=utf-8' });
            const blobUrl = URL.createObjectURL(blob);
            thumbHtml = `
              <div class="mini-stage-box">
                <iframe class="mini-stage-frame" src="${blobUrl}" sandbox="allow-scripts" loading="lazy" data-appid="${app.id}"></iframe>
              </div>`;
          } else {
            thumbHtml = `<span class="card-glyph">${glyph}</span>`;
          }

          card.innerHTML = `
            <div class="card-canvas-box">
              ${thumbHtml}
              <span class="card-badge">${app.category}</span>
            </div>
            <div class="card-body">
              <div class="card-title">${app.title}</div>
              <div class="card-author">${app.author || 'you'} &bull; ${app.views || 1} plays</div>
              <div class="card-desc">${app.description || 'HTML micro-app.'}</div>
              <div class="card-footer" onclick="event.stopPropagation()">
                <button class="btn-play-action" onclick="Platapp.openWatch('${app.id}')">Play</button>
                <button class="btn-icon-only" onclick="Platapp.deleteApp('${app.id}')" title="Delete">🗑</button>
              </div>
            </div>
          `;
          grid.appendChild(card);
        });

        // Scale mini preview frames to fit card dimensions
        requestAnimationFrame(() => {
          this.scaleMiniStages();
          this.autoSnapshotMiniStages();
        });
      },

      async openWatch(id) {
        window.location.hash = `#/watch/${id}`;
      },

      async loadWatch(id) {
        const app = await DB.getApp(id);
        if (!app) {
          window.location.hash = '#/';
          return;
        }

        this.activeApp = app;
        app.views = (app.views || 0) + 1;
        await DB.saveApp(app);

        document.getElementById('stageTitle').textContent = app.title;
        document.getElementById('stageAuthor').textContent = `By ${app.author || 'You'}`;
        document.getElementById('stagePlays').textContent = `${app.views} plays`;
        document.getElementById('stageDesc').textContent = app.description || '';
        document.getElementById('playerCategoryTag').textContent = app.category.toUpperCase();

        const pBox = document.getElementById('stagePromptBox');
        if (app.prompt) {
          pBox.style.display = 'block';
          document.getElementById('stagePrompt').textContent = app.prompt;
        } else {
          pBox.style.display = 'none';
        }

        this.mountCode(app.code, app.title);
        this.renderUpNext(app.id);

        document.getElementById('feedSection').style.display = 'none';
        document.getElementById('tabsBar').style.display = 'none';
        document.getElementById('playerSection').style.display = 'flex';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },

      
      scaleMiniStages() {
        document.querySelectorAll('.mini-stage-frame').forEach(iframe => {
          const parentW = iframe.parentElement?.clientWidth || 290;
          const scale = parentW / 800;
          iframe.style.transform = `scale(${scale})`;
        });
      },

      autoSnapshotMiniStages() {
        setTimeout(() => {
          document.querySelectorAll('.mini-stage-frame').forEach(iframe => {
            const appId = iframe.dataset.appid;
            if (appId && iframe.contentWindow) {
              iframe.contentWindow.postMessage('CAPTURE_THUMBNAIL', '*');
            }
          });
        }, 900);
      },

      captureSnapshot() {
        const iframe = document.getElementById('vibeStage');
        if (iframe && iframe.contentWindow) {
          iframe.contentWindow.postMessage('CAPTURE_THUMBNAIL', '*');
        }
      },

      showToast(msg) {
        let toast = document.getElementById('snapToast');
        if (!toast) {
          toast = document.createElement('div');
          toast.id = 'snapToast';
          toast.className = 'snap-toast';
          document.body.appendChild(toast);
        }
        toast.innerHTML = msg;
        toast.style.display = 'flex';
        setTimeout(() => { toast.style.display = 'none'; }, 2400);
      },

      mountCode(rawCode, title) {
        if (this.activeBlobUrl) {
          URL.revokeObjectURL(this.activeBlobUrl);
        }
        const normalized = CompatibilityEngine.normalizeHtml(rawCode, title);
        const blob = new Blob([normalized], { type: 'text/html;charset=utf-8' });
        this.activeBlobUrl = URL.createObjectURL(blob);

        const iframe = document.getElementById('vibeStage');
        iframe.src = this.activeBlobUrl;
      },

      renderUpNext(currentId) {
        const cont = document.getElementById('upNextContainer');
        cont.innerHTML = '';
        const others = this.apps.filter(a => a.id !== currentId).slice(0, 4);

        others.forEach(o => {
          const item = document.createElement('div');
          item.className = 'mini-card';
          item.onclick = () => this.openWatch(o.id);
          const glyph = o.glyph || (o.category === 'game' ? '🎮' : o.category === 'audio' ? '🎵' : '✨');

          item.innerHTML = `
            <span class="mini-glyph">${glyph}</span>
            <div style="overflow: hidden;">
              <div class="mini-title">${o.title}</div>
              <div style="font-size: 11px; color: var(--text-dim);">${o.category}</div>
            </div>
          `;
          cont.appendChild(item);
        });
      },

      route() {
        const hash = window.location.hash || '#/';
        if (hash.startsWith('#/watch/')) {
          this.loadWatch(hash.replace('#/watch/', ''));
        } else {
          if (this.activeBlobUrl) {
            URL.revokeObjectURL(this.activeBlobUrl);
            this.activeBlobUrl = null;
          }
          document.getElementById('vibeStage').src = 'about:blank';
          document.getElementById('playerSection').style.display = 'none';
          document.getElementById('feedSection').style.display = 'block';
          document.getElementById('tabsBar').style.display = 'flex';
          this.renderFeed();
        }
      },

      toggleAspect() {
        const wrapper = document.getElementById('stageWrapper');
        wrapper.className = 'stage-wrapper';
        this.aspectIdx = (this.aspectIdx + 1) % this.aspects.length;
        const mode = this.aspects[this.aspectIdx];
        document.getElementById('btnAspect').textContent = `📐 ${mode}`;

        if (mode === '1:1') wrapper.classList.add('aspect-1-1');
        else if (mode === '9:16') wrapper.classList.add('aspect-9-16');
        else if (mode === 'Fit') wrapper.classList.add('aspect-full');
      },

      async deleteApp(id) {
        if (!confirm('Delete this app?')) return;
        await DB.deleteApp(id);
        this.apps = this.apps.filter(a => a.id !== id);
        if (window.location.hash.includes(id)) {
          window.location.hash = '#/';
        } else {
          this.renderFeed();
        }
      },

      exportApp(id) {
        const app = this.apps.find(a => a.id === id) || this.activeApp;
        if (!app) return;
        const blob = new Blob([app.code], { type: 'text/html;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${app.title.toLowerCase().replace(/[^a-z0-9]/g, '_')}.html`;
        a.click();
      },

      bindEvents() {
        // Search
        document.getElementById('searchInput').addEventListener('input', (e) => {
          this.searchQuery = e.target.value.toLowerCase().trim();
          this.renderFeed();
        });

        // Tabs
        document.querySelectorAll('.tab-item').forEach(tab => {
          tab.addEventListener('click', () => {
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            this.currentCat = tab.dataset.cat;
            this.renderFeed();
          });
        });

        // Back
        document.getElementById('btnBackToFeed').addEventListener('click', () => {
          window.location.hash = '#/';
        });

        // Player actions
        document.getElementById('btnRestart').addEventListener('click', () => {
          if (this.activeApp) this.mountCode(this.activeApp.code, this.activeApp.title);
        });

        document.getElementById('btnSnapshot').addEventListener('click', () => {
          this.captureSnapshot();
        });

        document.getElementById('btnAspect').addEventListener('click', () => this.toggleAspect());

        document.getElementById('btnFullscreen').addEventListener('click', () => {
          const wrapper = document.getElementById('stageWrapper');
          if (!document.fullscreenElement) {
            wrapper.requestFullscreen?.() || wrapper.webkitRequestFullscreen?.();
          } else {
            document.exitFullscreen?.();
          }
        });

        document.getElementById('btnExport').addEventListener('click', () => {
          if (this.activeApp) this.exportApp(this.activeApp.id);
        });

        document.getElementById('btnDelete').addEventListener('click', () => {
          if (this.activeApp) this.deleteApp(this.activeApp.id);
        });

        // View Code Modal
        document.getElementById('btnViewCode').addEventListener('click', () => {
          if (!this.activeApp) return;
          document.getElementById('codeModalTitle').textContent = `Code: ${this.activeApp.title}`;
          document.getElementById('codePre').textContent = this.activeApp.code;
          document.getElementById('codeModal').style.display = 'flex';
        });

        document.getElementById('closeCodeModal').addEventListener('click', () => {
          document.getElementById('codeModal').style.display = 'none';
        });

        document.getElementById('copyCodeBtn').addEventListener('click', () => {
          if (!this.activeApp) return;
          navigator.clipboard.writeText(this.activeApp.code);
          const btn = document.getElementById('copyCodeBtn');
          btn.textContent = 'Copied!';
          setTimeout(() => { btn.textContent = '📋 Copy Code'; }, 2000);
        });

        // Upload
        const filePicker = document.getElementById('filePicker');
        document.getElementById('uploadBtn').addEventListener('click', () => filePicker.click());
        filePicker.addEventListener('change', async (e) => {
          const f = e.target.files[0];
          if (f) await this.handleFile(f);
          filePicker.value = '';
        });

        // Drag & Drop
        const dropOverlay = document.getElementById('dropZoneOverlay');
        let counter = 0;

        window.addEventListener('dragenter', (e) => {
          e.preventDefault();
          counter++;
          dropOverlay.classList.add('active');
        });

        window.addEventListener('dragleave', (e) => {
          e.preventDefault();
          counter--;
          if (counter <= 0) {
            counter = 0;
            dropOverlay.classList.remove('active');
          }
        });

        window.addEventListener('dragover', (e) => e.preventDefault());

        window.addEventListener('drop', async (e) => {
          e.preventDefault();
          counter = 0;
          dropOverlay.classList.remove('active');
          if (e.dataTransfer?.files?.length > 0) {
            const f = e.dataTransfer.files[0];
            if (f.name.endsWith('.html') || f.name.endsWith('.htm')) {
              await this.handleFile(f);
            }
          }
        });

        document.getElementById('closeUploadModal').addEventListener('click', () => {
          document.getElementById('uploadModal').style.display = 'none';
        });

        document.getElementById('saveUploadBtn').addEventListener('click', async () => {
          const title = document.getElementById('upTitle').value.trim() || 'Untitled';
          const category = document.getElementById('upCategory').value;
          const desc = document.getElementById('upDesc').value.trim();
          const prompt = document.getElementById('upPrompt').value.trim();

          const newApp = {
            id: 'app_' + Date.now(),
            title,
            category,
            description: desc,
            prompt,
            author: 'you',
            views: 0,
            code: this.stagedCode
          };

          await DB.saveApp(newApp);
          this.apps.unshift(newApp);
          document.getElementById('uploadModal').style.display = 'none';
          this.openWatch(newApp.id);
        });
      },

      async handleFile(file) {
        const text = await file.text();
        const meta = CompatibilityEngine.parseMeta(text, file.name);

        this.stagedCode = text;
        document.getElementById('upTitle').value = meta.title;
        document.getElementById('upCategory').value = meta.category;
        document.getElementById('upDesc').value = meta.desc;
        document.getElementById('upPrompt').value = meta.prompt;

        document.getElementById('uploadModal').style.display = 'flex';
      }
    };

    window.addEventListener('DOMContentLoaded', () => Platapp.init());
  </script>
</body>
</html>
