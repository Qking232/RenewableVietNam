<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- RenewableVietNam Brand Favicon & Touch Icons -->
    <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="../../assets/images/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="../../assets/images/favicon-32.png" sizes="32x32">
    <link rel="icon" type="image/png" href="../../assets/images/favicon.png" sizes="180x180">
    <link rel="apple-touch-icon" href="../../assets/images/apple-touch-icon.png">
  <title>Neon Particle Matrix</title>
  <meta name="description" content="Interactive neon particle canvas that flows with cursor movements and creates burst shockwaves.">
  <!-- prompt: Create an interactive canvas with flowing neon particles that react to mouse position, create color waves, and explode into sparks on click. -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #080810; font-family: sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    .hud {
      position: absolute; bottom: 16px; left: 16px; color: rgba(255,255,255,0.7);
      font-size: 13px; pointer-events: none; text-shadow: 0 0 8px rgba(0,255,255,0.5);
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hud">✨ Move cursor to guide particles &bull; Click for supernova burst</div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];
    let mouse = { x: null, y: null, active: false };
    let hue = 180;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
      constructor(x, y, isBurst = false) {
        this.x = x ?? Math.random() * width;
        this.y = y ?? Math.random() * height;
        const angle = Math.random() * Math.PI * 2;
        const speed = isBurst ? Math.random() * 8 + 3 : Math.random() * 2 + 0.5;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.radius = isBurst ? Math.random() * 3 + 2 : Math.random() * 2 + 1;
        this.color = `hsl(${hue + (Math.random() * 60 - 30)}, 100%, 65%)`;
        this.life = isBurst ? 1 : null;
        this.decay = Math.random() * 0.02 + 0.01;
      }

      update() {
        if (mouse.active && mouse.x !== null) {
          const dx = mouse.x - this.x;
          const dy = mouse.y - this.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 180 && dist > 5) {
            const force = (180 - dist) / 180;
            this.vx += (dx / dist) * force * 0.6;
            this.vy += (dy / dist) * force * 0.6;
          }
        }

        this.vx *= 0.98;
        this.vy *= 0.98;
        this.x += this.vx;
        this.y += this.vy;

        if (this.life !== null) {
          this.life -= this.decay;
        } else {
          if (this.x < 0) this.x = width;
          if (this.x > width) this.x = 0;
          if (this.y < 0) this.y = height;
          if (this.y > height) this.y = 0;
        }
      }

      draw() {
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, Math.max(0.1, this.radius * (this.life ?? 1)), 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 12;
        ctx.shadowColor = this.color;
        ctx.globalAlpha = this.life ?? 0.85;
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 120; i++) {
      particles.push(new Particle());
    }

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      mouse.active = true;
    });

    window.addEventListener('mouseleave', () => { mouse.active = false; });

    window.addEventListener('click', (e) => {
      for (let i = 0; i < 40; i++) {
        particles.push(new Particle(e.clientX, e.clientY, true));
      }
    });

    function connect() {
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.hypot(dx, dy);
          if (dist < 90) {
            const alpha = (1 - dist / 90) * 0.25;
            ctx.strokeStyle = `hsla(${hue}, 100%, 70%, ${alpha})`;
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      }
    }

    function animate() {
      ctx.fillStyle = 'rgba(8, 8, 16, 0.22)';
      ctx.fillRect(0, 0, width, height);

      hue = (hue + 0.3) % 360;

      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].life !== null && particles[i].life <= 0) {
          particles.splice(i, 1);
        }
      }

      while (particles.filter(p => p.life === null).length < 120) {
        particles.push(new Particle());
      }

      connect();
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
