    function renderModuleNavigation() {
      const navBar = document.getElementById('module-nav-bar');
      navBar.innerHTML = '';

      window.PORTAL_MODULES.forEach((mod, index) => {
        const btn = document.createElement('button');
        btn.id = 'nav-mod-' + mod.id;
        btn.type = 'button';
        btn.className = 'text-left p-2 sm:p-2.5 rounded-lg border transition-all cursor-pointer flex flex-col justify-between ' +
          (index === 0 
            ? 'bg-sky-700 text-white border-sky-800 shadow-xs ring-1 ring-sky-600/30' 
            : 'bg-white text-slate-800 border-slate-200 hover:bg-slate-50 hover:border-slate-300');
        
        btn.innerHTML = `
          <div class="flex items-center justify-between gap-1 mb-0.5">
            <span class="text-[9px] sm:text-[9.5px] font-mono uppercase tracking-wider font-bold ${index === 0 ? 'text-sky-200' : 'text-slate-400'}">${mod.tag || 'MODULE'}</span>
            <span class="text-[8.5px] font-mono px-1 py-0.2 rounded font-semibold ${index === 0 ? 'bg-sky-800 text-sky-100' : 'bg-slate-100 text-slate-500'}">${mod.badge || ''}</span>
          </div>
          <div class="text-[11.5px] sm:text-xs font-bold leading-tight truncate">${mod.shortTitle || mod.title}</div>
        `;
        
        btn.onclick = () => loadModule(mod.id);
        navBar.appendChild(btn);
      });

      if (window.PORTAL_MODULES.length > 0) {
        loadModule(window.PORTAL_MODULES[0].id);
      }
    }

    function loadModule(moduleId) {
      const targetMod = window.PORTAL_MODULES.find(m => m.id === moduleId);
      if (!targetMod) return;

      activeModuleId = moduleId;

      document.getElementById('active-module-title').innerText = targetMod.title;
      const standaloneLink = document.getElementById('open-standalone-link');
      standaloneLink.href = targetMod.file;

      window.PORTAL_MODULES.forEach(m => {
        const btn = document.getElementById('nav-mod-' + m.id);
        if (btn) {
          const tagSpan = btn.querySelector('span:nth-child(1)');
          const badgeSpan = btn.querySelector('span:nth-child(2)');
          if (m.id === moduleId) {
            btn.className = 'text-left p-2 sm:p-2.5 rounded-lg border transition-all cursor-pointer flex flex-col justify-between bg-sky-700 text-white border-sky-800 shadow-xs ring-1 ring-sky-600/30';
            if (tagSpan) tagSpan.className = 'text-[9px] sm:text-[9.5px] font-mono uppercase tracking-wider font-bold text-sky-200';
            if (badgeSpan) badgeSpan.className = 'text-[8.5px] font-mono px-1 py-0.2 rounded font-semibold bg-sky-800 text-sky-100';
          } else {
            btn.className = 'text-left p-2 sm:p-2.5 rounded-lg border transition-all cursor-pointer flex flex-col justify-between bg-white text-slate-800 border-slate-200 hover:bg-slate-50 hover:border-slate-300';
            if (tagSpan) tagSpan.className = 'text-[9px] sm:text-[9.5px] font-mono uppercase tracking-wider font-bold text-slate-400';
            if (badgeSpan) badgeSpan.className = 'text-[8.5px] font-mono px-1 py-0.2 rounded font-semibold bg-slate-100 text-slate-500';
          }
        }
      });

      const viewport = document.getElementById('module-viewport');
      viewport.style.opacity = '0.3';
      viewport.src = targetMod.file;
      viewport.onload = () => {
        viewport.style.opacity = '1';
        try {
          const doc = viewport.contentDocument || viewport.contentWindow.document;
          if (doc && doc.body) {
            const contentHeight = Math.max(doc.body.scrollHeight + 40, 1100);
            viewport.style.minHeight = contentHeight + 'px';
          }
        } catch (e) {
          viewport.style.minHeight = '1200px';
        }
      };
    }

    document.addEventListener('DOMContentLoaded', renderModuleNavigation);
  </script>
